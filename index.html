<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrativo SERMAS · Estudio y test</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --txt:#16202c; --suave:#5b6878; --borde:#e1e6ed;
  --pri:#0f5c7a; --pri-2:#0b4a63; --pri-claro:#e6f1f5;
  --ok:#1f7a4d; --ok-claro:#e5f4ec; --ko:#b3261e; --ko-claro:#fbe9e7; --ambar:#a15c00; --ambar-claro:#fdf1de;
  --gris:#8a96a5; --sombra:0 1px 2px rgba(16,32,48,.06),0 4px 16px rgba(16,32,48,.05); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f151c; --panel:#17202a; --txt:#e7edf3; --suave:#9aa8b8; --borde:#2a3644;
    --pri:#4fb3d9; --pri-2:#7fcbe8; --pri-claro:#173040; --ok:#5cc792; --ok-claro:#13301f; --ko:#ff8a80; --ko-claro:#3a1a18;
    --ambar:#f0b35a; --ambar-claro:#3a2a10; --gris:#6d7b8b; --sombra:none; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--pri)} a:hover{color:var(--pri-2)}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.6rem;letter-spacing:-.01em} h2{font-size:1.1rem} h3{font-size:1rem}
small{color:var(--suave)}
.top{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--borde)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap}
.marca-app{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--txt);font-weight:700}
.logo{width:32px;height:32px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:800}
.marca-app small{display:block;font-weight:500;font-size:.75rem}
.nav{display:flex;gap:.25rem;margin-left:auto;flex-wrap:wrap}
.nav a{padding:.45rem .8rem;border-radius:999px;text-decoration:none;color:var(--suave);font-weight:600;font-size:.92rem}
.nav a:hover{background:var(--pri-claro);color:var(--pri)}
.nav a.activo{background:var(--pri);color:#fff}
main,.avisos{max-width:1080px;margin:0 auto;padding:0 1rem}
main{padding-bottom:3rem}
.avisos{padding-top:1rem}
.version{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.88rem;padding:.55rem .85rem;border-radius:10px;border:1px solid var(--borde);background:var(--panel)}
.version .punto{width:9px;height:9px;border-radius:50%;background:var(--ambar);flex:none}
.version.ok .punto{background:var(--ok)}
.version.prov{border-color:color-mix(in srgb,var(--ambar) 35%,var(--borde))}
.info-version{font-size:.88rem;color:var(--suave);padding:.6rem .85rem}
.novedad{display:flex;gap:1rem;align-items:center;justify-content:space-between;background:var(--ok-claro);border:1px solid var(--ok);color:var(--txt);padding:.9rem 1rem;border-radius:12px;margin-bottom:.6rem}
.novedad p{margin:.2rem 0 0;font-size:.92rem}
.enlace{background:none;border:0;padding:0;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--pri);background:var(--pri);color:#fff;padding:.6rem 1.05rem;border-radius:10px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;transition:transform .05s,background .15s}
.btn:hover{background:var(--pri-2);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--panel);color:var(--pri);border-color:var(--borde)}
.btn.sec:hover{border-color:var(--pri);background:var(--pri-claro);color:var(--pri)}
.btn.peq{padding:.35rem .7rem;font-size:.85rem;border-radius:8px}
.btn.grande{padding:.8rem 1.4rem;font-size:1.05rem}
.btn.rojo{background:var(--ko);border-color:var(--ko);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);padding:1.2rem 1.3rem;margin:1rem 0;box-shadow:var(--sombra)}
.cab{margin:1.6rem 0 1rem} .cab p{color:var(--suave);margin:.2rem 0 0}
.sup{text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;font-weight:700;color:var(--pri);margin:0 0 .3rem}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;flex-wrap:wrap;margin:1.5rem 0 1rem;padding:1.6rem;border-radius:var(--r);background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 65%,#1a2f44));color:#fff}
.hero h1{font-size:1.75rem;max-width:30ch}
.hero .sup{color:rgba(255,255,255,.8)} .hero .sub{margin:.3rem 0 0;color:rgba(255,255,255,.85)}
.hero .btn{background:#fff;color:var(--pri);border-color:#fff}
.hero .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.hero .btn.sec:hover{background:rgba(255,255,255,.12)}
.hero-cta{display:flex;gap:.6rem;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin:1rem 0}
.kpi{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.15rem;box-shadow:var(--sombra)}
.kpi span{font-size:.85rem;color:var(--suave);font-weight:600}
.kpi strong{font-size:1.7rem;font-variant-numeric:tabular-nums}
.kpi.ok strong{color:var(--ok)} .kpi.ko strong{color:var(--ko)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid2 .card{margin:0}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.acciones{display:grid;gap:.5rem}
.accion{display:flex;gap:.8rem;align-items:center;padding:.75rem .85rem;border:1px solid var(--borde);border-radius:12px;text-decoration:none;color:var(--txt)}
.accion:hover{border-color:var(--pri);background:var(--pri-claro);color:var(--txt)}
.accion .ico{font-size:1.4rem} .accion small{display:block}
.datos{list-style:none;padding:0;margin:0}
.datos li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--borde);font-size:.93rem}
.datos li:last-child{border:0} .datos span{color:var(--suave)} .datos strong{text-align:right}
.vacio{color:var(--suave)}
.tabla-wrap{overflow-x:auto}
.tabla{width:100%;border-collapse:collapse;font-size:.92rem}
.tabla th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);padding:.5rem;border-bottom:1px solid var(--borde)}
.tabla td{padding:.55rem .5rem;border-bottom:1px solid var(--borde);vertical-align:middle}
.tabla .num{text-align:right;font-variant-numeric:tabular-nums}
.ok-t{color:var(--ok)} .ko-t{color:var(--ko)}
.nota{display:inline-block;padding:.1rem .5rem;border-radius:6px;font-weight:700}
.nota.ok{background:var(--ok-claro);color:var(--ok)} .nota.ko{background:var(--ko-claro);color:var(--ko)}
.buscador input{width:100%;padding:.75rem 1rem;border-radius:12px;border:1px solid var(--borde);background:var(--panel);color:var(--txt);font:inherit}
.bloque{margin:1.4rem 0}
.bloque-cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.5rem}
.bloque-cab h2{margin:0}
.tag{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;background:var(--pri-claro);color:var(--pri);padding:.15rem .5rem;border-radius:6px;margin-right:.35rem;vertical-align:2px}
.temas{list-style:none;padding:0;margin:0;background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden}
.tema-fila a{display:flex;gap:.85rem;align-items:flex-start;padding:.8rem 1rem;text-decoration:none;color:var(--txt);border-bottom:1px solid var(--borde)}
.tema-fila:last-child a{border:0}
.tema-fila a:hover{background:var(--pri-claro)}
.tema-num{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--borde);font-weight:700;font-size:.85rem;color:var(--suave)}
.tema-num.hecho{background:var(--ok);border-color:var(--ok);color:#fff}
.tema-tit{display:block}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.3rem}
.chip{font-size:.74rem;padding:.1rem .5rem;border-radius:999px;background:var(--pri-claro);color:var(--pri);font-weight:600}
.chip.gris{background:var(--bg);color:var(--gris)}
.chip.verde{background:var(--ok-claro);color:var(--ok)} .chip.ambar{background:var(--ambar-claro);color:var(--ambar)} .chip.rojo{background:var(--ko-claro);color:var(--ko)}
.migas{margin-top:1.2rem;font-size:.88rem;color:var(--suave)}
.tema-cab{display:flex;justify-content:space-between;gap:1rem;align-items:flex-end;flex-wrap:wrap}
.tema-cab h1{max-width:40ch}
.tema-acc{display:flex;gap:.5rem;flex-wrap:wrap}
.mini-stats{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.9rem;padding:.6rem .9rem;background:var(--panel);border:1px solid var(--borde);border-radius:10px}
.resumen{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);padding:1.3rem 1.5rem;margin:1rem 0;box-shadow:var(--sombra)}
.resumen .norma{font-weight:650;color:var(--pri);margin:0 0 1rem}
.resumen section{margin-top:1.1rem}
.resumen h2{font-size:1.02rem;border-left:3px solid var(--pri);padding-left:.6rem}
.resumen ul{margin:.4rem 0 0;padding-left:1.2rem}
.resumen li{margin:.35rem 0;max-width:75ch}
.clave{background:var(--ambar-claro);border:1px solid color-mix(in srgb,var(--ambar) 40%,transparent);border-radius:12px;padding:.85rem 1rem}
.clave h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ambar);margin:0 0 .3rem}
.clave ul{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:0}
.clave li{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:.25rem .6rem;font-size:.88rem;margin:0}
.paginar{display:flex;justify-content:space-between;margin-top:1.5rem}
.opciones-modo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin-bottom:1.2rem}
.modo{text-align:left;border:1px solid var(--borde);background:var(--panel);color:var(--txt);border-radius:12px;padding:.8rem .9rem;cursor:pointer;font:inherit}
.modo small{display:block}
.modo.sel{border-color:var(--pri);background:var(--pri-claro);box-shadow:inset 0 0 0 1px var(--pri)}
.campo{display:flex;flex-direction:column;gap:.35rem;font-weight:600;margin-bottom:1.2rem}
.campo select{padding:.65rem .8rem;border-radius:10px;border:1px solid var(--borde);background:var(--panel);color:var(--txt);font:inherit;font-weight:400}
.segmentado{display:inline-flex;flex-wrap:wrap;border:1px solid var(--borde);border-radius:10px;overflow:hidden;margin-bottom:1.2rem}
.segmentado button{border:0;border-right:1px solid var(--borde);background:var(--panel);color:var(--txt);padding:.55rem 1rem;font:inherit;cursor:pointer}
.segmentado button:last-child{border-right:0}
.segmentado button.sel{background:var(--pri);color:#fff;font-weight:650}
.segmentado.peq button{padding:.35rem .7rem;font-size:.85rem}
.check{display:flex;gap:.5rem;align-items:center;font-size:.92rem}
.aviso-sim{background:var(--pri-claro);border-radius:12px;padding:.9rem 1rem;font-size:.93rem}
.pie-cfg{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--borde);flex-wrap:wrap}
.disp{color:var(--suave);font-size:.9rem}
.test-top{position:sticky;top:57px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--bg);padding:1rem 0 .6rem;flex-wrap:wrap}
.test-top small{display:block}
.reloj{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem;padding:.25rem .7rem;border-radius:8px;background:var(--panel);border:1px solid var(--borde)}
.reloj.urgente{color:var(--ko);border-color:var(--ko)} .reloj.oculto{visibility:hidden}
.barra{height:6px;background:var(--borde);border-radius:99px;overflow:hidden}
.barra span{display:block;height:100%;background:var(--pri);transition:width .2s}
.pregunta{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);padding:1.4rem 1.5rem;margin:1rem 0;box-shadow:var(--sombra)}
.q-meta{font-size:.8rem;color:var(--suave);margin:0 0 .4rem;font-weight:600}
.marca{color:var(--ambar)}
.q-txt{font-size:1.15rem;font-weight:650;margin-bottom:1rem}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;padding:.8rem .9rem;border:1.5px solid var(--borde);border-radius:12px;background:var(--panel);color:var(--txt);font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--pri);background:var(--pri-claro)}
.opt .letra{flex:none;width:1.8rem;height:1.8rem;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:.88rem}
.opt.sel{border-color:var(--pri);background:var(--pri-claro)} .opt.sel .letra{background:var(--pri);color:#fff}
.opt.correcta{border-color:var(--ok);background:var(--ok-claro)} .opt.correcta .letra{background:var(--ok);color:#fff}
.opt.incorrecta{border-color:var(--ko);background:var(--ko-claro)} .opt.incorrecta .letra{background:var(--ko);color:#fff}
.opt[disabled]{cursor:default}
.explic{margin-top:1rem;padding:.85rem 1rem;border-radius:10px;font-size:.95rem}
.explic.ok{background:var(--ok-claro)} .explic.ko{background:var(--ko-claro)}
.test-nav{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.test-nav-mid{display:flex;gap:1rem}
.mapa{margin-top:1.2rem;background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:.7rem 1rem}
.mapa summary{cursor:pointer;font-weight:650}
.mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:.35rem;margin-top:.7rem}
.mapa-grid button{height:36px;border-radius:8px;border:1px solid var(--borde);background:var(--panel);color:var(--txt);font:inherit;font-size:.85rem;cursor:pointer}
.mapa-grid .resp{background:var(--pri-claro);border-color:var(--pri)}
.mapa-grid .bien{background:var(--ok-claro);border-color:var(--ok)} .mapa-grid .mal{background:var(--ko-claro);border-color:var(--ko)}
.mapa-grid .actual{outline:2px solid var(--pri);outline-offset:1px;font-weight:800}
.mapa-grid .marc{box-shadow:inset 0 -3px 0 var(--ambar)}
.resultado{display:grid;grid-template-columns:220px 1fr;gap:1rem;align-items:stretch}
@media (max-width:700px){.resultado{grid-template-columns:1fr}}
.nota-grande{border-radius:var(--r);padding:1.3rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff}
.nota-grande.ok{background:var(--ok)} .nota-grande.ko{background:var(--ko)}
.nota-grande strong{font-size:3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.nota-grande small,.nota-grande span{color:rgba(255,255,255,.9)}
.res-datos{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);padding:1.1rem 1.2rem}
.res-barra{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--borde);gap:2px}
.b-ok{background:var(--ok)} .b-ko{background:var(--ko)} .b-bl{background:var(--gris)}
.res-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:1rem}
@media (max-width:560px){.res-kpis{grid-template-columns:1fr 1fr}}
.res-kpis strong{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.res-kpis span{font-size:.8rem;color:var(--suave)}
.nota-calc{font-size:.88rem;color:var(--suave);margin:.9rem 0 0}
.res-acc{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
.rev-cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.rev-cab .segmentado{margin-bottom:0}
.rev{border-top:1px solid var(--borde);padding:1rem 0}
.rev:first-of-type{border-top:0}
.rev .estado{font-weight:700}
.rev.ok .estado{color:var(--ok)} .rev.ko .estado{color:var(--ko)} .rev.bl .estado{color:var(--gris)}
.rev h3{font-size:1rem;font-weight:650}
.rev-opts{list-style:none;padding:0;margin:.5rem 0;display:grid;gap:.35rem}
.rev-opts li{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem .6rem;border-radius:8px;font-size:.93rem}
.rev-opts .letra{flex:none;font-weight:700;width:1.4rem}
.rev-opts em{margin-left:auto;font-style:normal;font-size:.78rem;font-weight:700;white-space:nowrap}
.rev-opts .correcta{background:var(--ok-claro)} .rev-opts .correcta em{color:var(--ok)}
.rev-opts .incorrecta{background:var(--ko-claro)} .rev-opts .incorrecta em{color:var(--ko)}
.explic-txt{font-size:.92rem;color:var(--suave);margin:.4rem 0 0}
.sol{margin:.5rem 0 0}
.barrita{display:inline-block;width:90px;height:8px;background:var(--borde);border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:.4rem}
.barrita span{display:block;height:100%}
.barrita .verde{background:var(--ok)} .barrita .ambar{background:var(--ambar)} .barrita .rojo{background:var(--ko)}
.aviso-flojos ul{padding-left:1.1rem} .aviso-flojos li{margin:.4rem 0}
.peligro{border-color:color-mix(in srgb,var(--ko) 35%,var(--borde))}
.evol{width:100%;height:auto}
.evol .rejilla{stroke:var(--borde)} .evol .corte{stroke:var(--ambar);stroke-dasharray:5 4}
.evol .eje{fill:var(--suave);font-size:11px}
.evol .linea{fill:none;stroke:var(--pri);stroke-width:2.5}
.evol .p-ok{fill:var(--ok)} .evol .p-ko{fill:var(--ko)}
/* ---- Repaso ---- */
button.accion{width:100%;background:var(--panel);font:inherit;text-align:left;cursor:pointer}
.accion.destacada{border-color:var(--pri);background:var(--pri-claro)}
.pestanas{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.pestanas a{padding:.5rem .9rem;border-radius:10px;border:1px solid var(--borde);background:var(--panel);text-decoration:none;color:var(--txt);font-weight:600}
.pestanas a.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.intro{color:var(--suave);max-width:70ch}
.card.hoy{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;background:var(--pri-claro);border-color:var(--pri)}
.card.hoy p{margin:.2rem 0 0;max-width:60ch}
.como{margin:.3rem 0 0;padding-left:1.3rem} .como li{margin:.35rem 0}
.mazo-sel{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap}
.mazo-sel .campo{flex:1;min-width:240px;margin-bottom:.8rem} .mazo-sel .btn{margin-bottom:.8rem}
.lista-tablas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.6rem}
.trucos ul{list-style:none;padding:0;margin:0}
.trucos li{display:grid;gap:.15rem;padding:.6rem 0;border-top:1px solid var(--borde)}
.trucos li:first-child{border-top:0}
.trucos li span{color:var(--suave);font-size:.93rem} .trucos li em{font-style:normal;color:var(--ambar);font-weight:600;font-size:.93rem}
.tarjeta{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1rem;text-align:center;width:100%;min-height:300px;margin:1rem 0;padding:2rem 1.5rem;border-radius:18px;border:1.5px solid var(--borde);background:var(--panel);color:var(--txt);font:inherit;cursor:pointer;box-shadow:var(--sombra);transition:border-color .15s}
.tarjeta:hover{border-color:var(--pri)}
.tarjeta.girada{cursor:default;border-color:var(--pri)}
.t-meta{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--pri);font-weight:700}
.t-frente{font-size:1.35rem;font-weight:700;max-width:34ch;line-height:1.35}
.tarjeta.girada .t-frente{font-size:1.05rem;color:var(--suave);font-weight:600}
.t-reverso{font-size:1.3rem;font-weight:700;color:var(--pri);max-width:40ch;line-height:1.4;padding-top:1rem;border-top:1px dashed var(--borde)}
.t-truco{background:var(--ambar-claro);color:var(--txt);border-radius:10px;padding:.55rem .9rem;font-size:.95rem;max-width:46ch}

   PREGUNTAS DE NIVEL INTERMEDIO-AVANZADO (2) Y AVANZADO (3)

const PREGUNTAS_AVANZADAS_RAW = [
  // ---------- Procedimiento I (lpac1) ----------
  ["av-lp01","lpac1","Un acto que no pone fin a la vía administrativa se notifica el 31 de enero de 2025. Sabiendo que el 28 de febrero de 2025 fue viernes y no festivo, ¿cuál es el último día para interponer recurso de alzada?",["28 de febrero de 2025","1 de marzo de 2025","2 de marzo de 2025","3 de marzo de 2025"],0,"Art. 30.4 Ley 39/2015: el plazo por meses vence el mismo día del mes de vencimiento en que se notificó; si ese día no existe (31 de febrero), vence el último día del mes. Como el 28 de febrero era hábil, no se prorroga al lunes 3 de marzo.",3],
  ["av-lp02","lpac1","Se notifica el viernes día 3 un requerimiento para subsanar una solicitud. Suponiendo que en ese mes no hay ningún festivo, ¿cuál es el último día del plazo?",["El lunes 13","El jueves 16","El viernes 17","El lunes 20"],2,"10 días hábiles (art. 68.1) contados desde el día siguiente (art. 30.3) y sin sábados ni domingos: lunes 6 a viernes 10 (5 días) y lunes 13 a viernes 17 (10 días).",3],
  ["av-lp03","lpac1","En una notificación en papel nadie se hace cargo de ella en el primer intento, realizado a las 14:30 del lunes. El segundo intento debe hacerse:",["Al día siguiente, a cualquier hora","Dentro de los 3 días siguientes, después de las 15:00 y con al menos 3 horas de diferencia respecto del primero","Dentro de los 5 días siguientes, en horario de mañana","No hay segundo intento: se publica directamente en el BOE"],1,"Art. 42.2 Ley 39/2015: se repite una sola vez, en hora distinta, dentro de los 3 días siguientes; si el primer intento fue antes de las 15:00, el segundo debe ser después de las 15:00 (y viceversa), con un margen mínimo de 3 horas.",3],
  ["av-lp04","lpac1","Para entender cumplida la obligación de notificar dentro del plazo máximo de duración del procedimiento basta con:",["Que el acto se haya dictado dentro del plazo","La notificación que contenga, al menos, el texto íntegro de la resolución, así como el intento de notificación debidamente acreditado","Que el interesado acceda a la notificación dentro del plazo","La publicación en el tablón de anuncios del órgano"],1,"Art. 40.4 Ley 39/2015. Dictar el acto en plazo no basta: hay que notificarlo o, al menos, intentarlo de forma acreditada.",2],
  ["av-lp05","lpac1","Un Jefe de Servicio dicta una resolución que correspondía a su Director General, dentro de la misma materia y territorio. Ese acto es:",["Nulo de pleno derecho por incompetencia","Anulable, y el Director General puede convalidarlo","Inexistente","Válido, porque ambos pertenecen al mismo órgano"],1,"La incompetencia jerárquica no es «manifiesta por razón de la materia o del territorio» (art. 47.1 b), así que es anulable (art. 48). Art. 52.3: la puede convalidar el órgano competente cuando sea superior jerárquico del que dictó el acto.",3],
  ["av-lp06","lpac1","La realización de actuaciones administrativas fuera del tiempo establecido para ellas:",["Siempre determina la nulidad de pleno derecho","Siempre determina la anulabilidad","Solo implica anulabilidad cuando así lo imponga la naturaleza del término o plazo","Nunca tiene consecuencias sobre la validez"],2,"Art. 48.3 Ley 39/2015.",2],
  ["av-lp07","lpac1","Una solicitud se desestima por silencio. El interesado interpone recurso de alzada y la Administración tampoco lo resuelve en plazo. Si la materia no es de las excluidas por la ley, el recurso se entiende:",["Desestimado, porque en los recursos el silencio es siempre negativo","Estimado","Caducado","Pendiente hasta que se dicte resolución expresa"],1,"Art. 24.1 Ley 39/2015: el silencio en los recursos es desestimatorio, salvo cuando la alzada se interpuso contra la desestimación por silencio de una solicitud: entonces el recurso se entiende estimado.",3],
  ["av-lp08","lpac1","Producido un silencio estimatorio, la Administración dicta tarde una resolución expresa. Esa resolución:",["Puede ser de cualquier sentido","Solo puede dictarse si es confirmatoria del silencio","Debe ser siempre desestimatoria para corregir el silencio","Es nula, porque ya no existe obligación de resolver"],1,"Art. 24.3 a) Ley 39/2015. En cambio, tras un silencio desestimatorio la resolución expresa posterior se adopta sin vinculación al sentido del silencio (art. 24.3 b).",3],
  ["av-lp09","lpac1","¿En cuál de estas actuaciones se PRESUME la representación, sin necesidad de acreditarla?",["Interponer un recurso","Desistir de una solicitud","Renunciar a un derecho","Realizar actos y gestiones de mero trámite"],3,"Art. 5.3 Ley 39/2015: hay que acreditar la representación para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir y renunciar. Para los actos de mero trámite se presume.",2],
  ["av-lp10","lpac1","Sobre la ampliación de plazos, señale la afirmación INCORRECTA:",["Puede acordarse de oficio o a petición de los interesados","No puede exceder de la mitad del plazo inicial","Puede acordarse una vez vencido el plazo si hay causa justificada","El acuerdo de ampliación o de denegación no es recurrible"],2,"Art. 32.3 Ley 39/2015: en ningún caso puede ampliarse un plazo ya vencido; la ampliación debe pedirse y acordarse antes de que venza.",2],
  ["av-lp11","lpac1","Excepcionalmente, los actos administrativos pueden tener eficacia retroactiva:",["Siempre que lo acuerde el superior jerárquico","Cuando se dicten en sustitución de actos anulados y cuando produzcan efectos favorables al interesado, si los supuestos de hecho ya existían y no se lesionan derechos de terceros","Cuando sean desfavorables y lo exija el interés público","Nunca: la irretroactividad de los actos es absoluta"],1,"Art. 39.3 Ley 39/2015.",3],
  ["av-lp12","lpac1","Cuando, intentada la notificación, no se ha podido practicar, la notificación se hace:",["Mediante anuncio en el Boletín Oficial del Estado","Solo en el boletín oficial de la comunidad autónoma","Solo en el tablón del ayuntamiento del último domicilio","Se entiende practicada sin más trámite"],0,"Art. 44 Ley 39/2015: anuncio obligatorio en el BOE; las demás publicaciones son potestativas y adicionales.",2],
  ["av-lp13","lpac1","Un plazo de 10 días naturales vence en domingo. ¿Qué ocurre?",["Vence ese domingo, porque los días naturales incluyen los inhábiles","Se adelanta al viernes anterior","Se prorroga al primer día hábil siguiente","Se prorroga 2 días naturales"],2,"Art. 30.5 Ley 39/2015: cuando el último día del plazo es inhábil, se prorroga al primer día hábil siguiente, también en los plazos por días naturales.",2],

  // ---------- Procedimiento II (lpac2) ----------
  ["av-lq01","lpac2","En un procedimiento selectivo de concurrencia competitiva, el plazo de 10 días para subsanar la solicitud:",["Puede ampliarse hasta 5 días si la aportación presenta dificultades especiales","No puede ampliarse","Puede ampliarse hasta la mitad","Puede ampliarse sin límite si lo pide el interesado"],1,"Art. 68.2 Ley 39/2015: la ampliación de hasta 5 días no se aplica en los procedimientos selectivos o de concurrencia competitiva.",3],
  ["av-lq02","lpac2","Se puede prescindir del trámite de audiencia cuando:",["El procedimiento lleva más de 3 meses","No figuren ni se tengan en cuenta otros hechos, alegaciones o pruebas que los aducidos por el interesado","El órgano instructor lo considere conveniente","El interesado no haya presentado alegaciones iniciales"],1,"Art. 82.4 Ley 39/2015.",2],
  ["av-lq03","lpac2","Una persona comparece en el trámite de información pública de un procedimiento. Por ese solo hecho:",["Adquiere la condición de interesado","No adquiere la condición de interesado, pero tiene derecho a una respuesta razonada","Queda obligada a recurrir la resolución","Pierde el derecho a recurrir si no comparece después en audiencia"],1,"Art. 83.3 Ley 39/2015: comparecer no otorga la condición de interesado, aunque sí el derecho a obtener una respuesta razonada; y no comparecer no impide recurrir.",2],
  ["av-lq04","lpac2","El periodo de prueba ordinario y el extraordinario tienen, respectivamente, una duración de:",["Entre 10 y 30 días / no superior a 10 días","Entre 5 y 15 días / no superior a 5 días","Entre 10 y 20 días / no superior a 15 días","1 mes / 15 días"],0,"Art. 77.2 Ley 39/2015.",2],
  ["av-lq05","lpac2","Un informe preceptivo no se emite en el plazo de 10 días. ¿Qué puede hacer el órgano instructor?",["Proseguir siempre las actuaciones","Suspender el transcurso del plazo máximo para resolver","Archivar el procedimiento","Entender que el informe es favorable"],1,"Art. 80.3 Ley 39/2015: si el informe no llega se pueden proseguir las actuaciones, salvo que sea preceptivo; en ese caso se puede suspender el plazo para resolver (art. 22.1 d), por un máximo de 3 meses.",3],
  ["av-lq06","lpac2","La Administración acuerda de oficio la tramitación simplificada y un interesado manifiesta su oposición expresa. Entonces:",["Se sigue la simplificada, porque la decisión es de la Administración","Se debe seguir la tramitación ordinaria","El procedimiento caduca","Se resuelve en 15 días"],1,"Art. 96.2 Ley 39/2015.",3],
  ["av-lq07","lpac2","Sobre la caducidad del procedimiento, señale la correcta:",["La caducidad produce por sí sola la prescripción de las acciones","Los procedimientos caducados no interrumpen el plazo de prescripción","Un procedimiento caducado interrumpe la prescripción desde su inicio","La caducidad impide iniciar un nuevo procedimiento"],1,"Art. 95.3 Ley 39/2015: la caducidad no produce por sí sola la prescripción, pero los procedimientos caducados no la interrumpen. Si no ha prescrito, puede abrirse otro procedimiento.",3],
  ["av-lq08","lpac2","Se propone una sanción de 1.000 €. El infractor reconoce su responsabilidad y paga voluntariamente antes de la resolución. Aplicando las reducciones mínimas legales, ¿cuánto pagaría?",["800 €","640 €","600 €","500 €"],2,"Art. 85.3 Ley 39/2015: cada reducción es de al menos el 20% sobre el importe de la sanción propuesta y son acumulables: 20% + 20% = 40%; 1.000 − 400 = 600 €. 640 € sería aplicar el segundo 20% sobre lo ya reducido, que no es lo que dice la ley.",3],
  ["av-lq09","lpac2","Hay tres interesados en un procedimiento iniciado a su solicitud y uno de ellos desiste. ¿Qué ocurre?",["Termina el procedimiento para todos","El desistimiento solo afecta a quien lo ha formulado","Los demás deben ratificar su solicitud en 10 días","El procedimiento caduca"],1,"Art. 94.2 Ley 39/2015.",2],
  ["av-lq10","lpac2","En los procedimientos tramitados a solicitud del interesado, la resolución:",["Puede agravar su situación inicial si hay interés público","Será congruente con lo pedido y en ningún caso podrá agravar su situación inicial","Puede resolver cuestiones no planteadas sin audiencia","Puede modificar lo pedido si el interesado no alega en plazo"],1,"Art. 88.2 Ley 39/2015.",2],

  // ---------- Procedimiento III (lpac3) ----------
  ["av-lr01","lpac3","Si el acto que se quiere recurrir en alzada es presunto (silencio), el recurso puede interponerse:",["En el plazo de 1 mes desde que se produce el silencio","En el plazo de 3 meses","En cualquier momento a partir del día siguiente a aquel en que se produzcan los efectos del silencio","Solo después de pedir certificado de silencio"],2,"Art. 122.1 Ley 39/2015.",2],
  ["av-lr02","lpac3","Un interesado pide la suspensión del acto que recurre. Si en 1 mes desde que la solicitud entró en el registro del órgano competente no se ha dictado ni notificado resolución sobre ella:",["La suspensión se entiende denegada","La ejecución del acto se entiende suspendida","El recurso se entiende estimado","El plazo para resolver el recurso se amplía"],1,"Art. 117.3 Ley 39/2015: silencio positivo en la solicitud de suspensión.",3],
  ["av-lr03","lpac3","Un acto firme se dictó a partir de documentos que una sentencia judicial firme posterior declara falsos. El recurso extraordinario de revisión:",["Se interpone ante el órgano que dictó el acto, en 3 meses desde que la sentencia quedó firme","Se interpone ante el superior jerárquico, en 4 años desde la notificación","Se interpone ante el Tribunal Superior de Justicia en 2 meses","No cabe: solo procede por error de hecho"],0,"Art. 125 Ley 39/2015: el plazo de 4 años es solo para el error de hecho que resulte de los documentos del expediente; en los demás casos, 3 meses. Se interpone ante el órgano que dictó el acto.",3],
  ["av-lr04","lpac3","En la revisión de oficio de un acto nulo, si transcurren 6 meses desde su inicio sin resolución:",["Si se inició de oficio, caduca; si fue a solicitud del interesado, se entiende desestimada","Siempre se entiende estimada","Siempre caduca","Se convierte en declaración de lesividad"],0,"Art. 106.5 Ley 39/2015.",3],
  ["av-lr05","lpac3","Iniciado el procedimiento de declaración de lesividad, si en ___ no se ha declarado, se produce ___:",["3 meses / la desestimación","6 meses / la caducidad","1 año / la prescripción","4 años / la caducidad"],1,"Art. 107.3 Ley 39/2015. No confundir con los 4 años que hay para declarar la lesividad desde que se dictó el acto.",3],
  ["av-lr06","lpac3","¿Contra cuál de estos actos de trámite cabe recurso administrativo?",["Uno que produce indefensión al interesado","El acuerdo de ampliación de un plazo","La petición de un informe facultativo","La apertura del periodo de prueba"],0,"Art. 112.1 Ley 39/2015: solo los actos de trámite cualificados (deciden el fondo, impiden continuar, producen indefensión o perjuicio irreparable). La ampliación de plazos no es recurrible (art. 32.3).",2],
  ["av-lr07","lpac3","Contra una orden de una Consejería que aprueba un reglamento (disposición de carácter general):",["Cabe recurso de alzada","Cabe recurso potestativo de reposición","No cabe recurso en vía administrativa; se impugna ante la jurisdicción contencioso-administrativa","Solo cabe recurso extraordinario de revisión"],2,"Art. 112.3 Ley 39/2015.",3],
  ["av-lr08","lpac3","Un recurso de alzada se presenta ante el órgano que dictó el acto, y no ante el competente para resolverlo. Ese órgano debe:",["Inadmitirlo por error en el destinatario","Remitirlo al competente en 10 días, con su informe y una copia completa y ordenada del expediente","Resolverlo él mismo","Devolverlo al interesado para que lo presente bien"],1,"Art. 121.2 Ley 39/2015.",3],
  ["av-lr09","lpac3","La Administración puede revocar sus actos de gravamen o desfavorables:",["En cualquier momento y sin límites","Mientras no haya transcurrido el plazo de prescripción, si no supone una dispensa no permitida ni es contraria a la igualdad, al interés público o al ordenamiento","Solo en los 4 años siguientes y previa declaración de lesividad","Solo con dictamen del órgano consultivo"],1,"Art. 109.1 Ley 39/2015.",3],
  ["av-lr10","lpac3","Una resolución que pone fin a la vía administrativa se recurre en reposición y, sin esperar, el interesado presenta recurso contencioso-administrativo. ¿Es correcto?",["Sí, los dos recursos son compatibles","No: no puede acudir al contencioso hasta que la reposición se resuelva expresamente o se desestime por silencio","Sí, si la reposición no se ha admitido aún","No, porque la reposición es obligatoria"],1,"Art. 123.2 Ley 39/2015. La reposición es potestativa, pero si se elige hay que esperar a su resolución.",3],
  ["av-lr11","lpac3","El interesado llama «recurso de reposición» a lo que es realmente un recurso de alzada. ¿Qué ocurre?",["Se inadmite","Se tramita como lo que es, porque el error en la calificación no es obstáculo si se deduce su verdadero carácter","Debe presentarlo de nuevo","Se tramita como reclamación"],1,"Art. 115.2 Ley 39/2015.",2],

  // ---------- Régimen jurídico I (lrjsp1) ----------
  ["av-rj01","lrjsp1","¿En cuál de estos casos NO hay causa de abstención por parentesco del funcionario con el interesado?",["El interesado es primo hermano del funcionario","El interesado es cuñado del funcionario","El interesado es sobrino del cónyuge del funcionario","El interesado es abuelo del funcionario"],2,"Art. 23.2 b) Ley 40/2015: consanguinidad hasta el 4.º grado (primo hermano = 4.º; abuelo = 2.º) y afinidad hasta el 2.º (cuñado = 2.º). El sobrino del cónyuge es afinidad de 3.er grado.",3],
  ["av-rj02","lrjsp1","Un funcionario debe tramitar un expediente de una empresa a la que prestó servicios profesionales hace un año. ¿Qué debe hacer?",["Abstenerse, porque le prestó servicios profesionales en los dos últimos años","Solo abstenerse si sigue cobrando de la empresa","Nada: solo cuenta el parentesco","Seguir si lo comunica al interesado"],0,"Art. 23.2 e) Ley 40/2015.",3],
  ["av-rj03","lrjsp1","Los actos en los que ha intervenido una autoridad que debió abstenerse y no lo hizo:",["Son siempre nulos de pleno derecho","Son siempre anulables","No implican necesariamente la invalidez de los actos","Son inexistentes"],2,"Art. 23.4 Ley 40/2015. Eso sí, no abstenerse da lugar a responsabilidad (art. 23.5).",3],
  ["av-rj04","lrjsp1","Contra el acuerdo de avocación:",["Cabe recurso de alzada","Cabe recurso de reposición","No cabe recurso, aunque puede impugnarse en el recurso que se interponga contra la resolución del procedimiento","Cabe recurso contencioso directo"],2,"Art. 10.2 Ley 40/2015. El acuerdo debe ser motivado y notificarse antes o a la vez que la resolución final.",3],
  ["av-rj05","lrjsp1","Las resoluciones administrativas adoptadas por delegación se consideran dictadas por:",["El órgano delegado","El órgano delegante","El superior jerárquico de ambos","El órgano que publique la delegación"],1,"Art. 9.4 Ley 40/2015. Por eso, a efectos de recursos, cuenta el órgano delegante.",2],
  ["av-rj06","lrjsp1","Salvo autorización expresa de una ley, ¿se pueden delegar las competencias que se ejercen por delegación?",["Sí, siempre","No","Sí, con autorización del superior","Sí, si se publica en el boletín oficial"],1,"Art. 9.5 Ley 40/2015: no cabe la «subdelegación» salvo que una ley lo autorice expresamente.",3],
  ["av-rj07","lrjsp1","¿Puede un órgano colegiado acordar sobre un asunto que no figura en el orden del día?",["Nunca","Sí, si lo propone el Presidente","Sí, si asisten todos sus miembros y la mayoría declara la urgencia del asunto","Sí, si lo pide un tercio de los miembros"],2,"Art. 17.4 Ley 40/2015.",3],
  ["av-rj08","lrjsp1","Sobre la suplencia, señale la correcta:",["Altera la competencia del órgano suplido","Para su validez no es necesaria su publicación","Debe aprobarla siempre el Consejo de Gobierno","Solo cabe por enfermedad"],1,"Art. 13 Ley 40/2015: la suplencia no altera la competencia y no requiere publicación.",2],
  ["av-rj09","lrjsp1","Si el funcionario recusado niega que se dé la causa alegada:",["Se archiva la recusación","El superior resolverá en 3 días, previos los informes y comprobaciones oportunos","Resuelve el propio recusado","Se suspende el procedimiento 1 mes"],1,"Art. 24.4 Ley 40/2015. Contra esa resolución no cabe recurso, aunque la recusación puede alegarse al recurrir el acto final (art. 24.5).",3],
  ["av-rj10","lrjsp1","¿Quiénes NO pueden abstenerse en las votaciones de un órgano colegiado?",["Los miembros que no hayan asistido a la sesión anterior","Las autoridades o personal al servicio de las Administraciones que sean miembros natos en virtud de su cargo","Los representantes de organizaciones sindicales","El Secretario que no es miembro"],1,"Art. 19 Ley 40/2015.",3],

  // ---------- Régimen jurídico II (lrjsp2) ----------
  ["av-rk01","lrjsp2","Se recurre en alzada una resolución sancionadora y el recurso se desestima por silencio. ¿Desde cuándo empieza a prescribir la sanción?",["Desde que se dictó la sanción","Desde el día siguiente a aquel en que finaliza el plazo legal para resolver el recurso","Desde que el interesado acude al contencioso","No prescribe mientras no haya resolución expresa"],1,"Art. 30.3 Ley 40/2015.",3],
  ["av-rk02","lrjsp2","El plazo de prescripción de una infracción, interrumpido al iniciarse el procedimiento sancionador con conocimiento del interesado, vuelve a correr si el expediente está paralizado:",["Más de 15 días por cualquier causa","Más de 1 mes por causa no imputable al presunto responsable","Más de 3 meses por causa imputable al interesado","Más de 6 meses"],1,"Art. 30.2 Ley 40/2015.",3],
  ["av-rk03","lrjsp2","Para graduar la sanción, la reincidencia se entiende como:",["Cualquier infracción anterior","La comisión en el término de 1 año de más de una infracción de la misma naturaleza, declarada por resolución firme en vía administrativa","La comisión de 3 infracciones en 2 años","Haber sido sancionado alguna vez en vía penal"],1,"Art. 29.3 d) Ley 40/2015.",3],
  ["av-rk04","lrjsp2","Un paciente sufre un daño por un efecto adverso que, según el estado de la ciencia en el momento de la asistencia, no se podía prever ni evitar. ¿Hay responsabilidad patrimonial?",["Sí, porque la responsabilidad es objetiva","No: esos daños no son indemnizables","Sí, pero solo por la mitad","Solo si el paciente firmó el consentimiento informado"],1,"Art. 34.1 Ley 40/2015: no son indemnizables los daños derivados de hechos o circunstancias que no se hubiesen podido prever o evitar según el estado de los conocimientos de la ciencia o de la técnica existentes en el momento de producirse.",3],
  ["av-rk05","lrjsp2","Un ciudadano sufre un daño por la actuación de un empleado del SERMAS. ¿A quién reclama la indemnización?",["Directamente al empleado","Directamente a la Administración","A los dos, de forma solidaria","Al seguro privado del empleado"],1,"Art. 36.1 Ley 40/2015. Después, la Administración puede exigir al empleado la responsabilidad si hubo dolo, o culpa o negligencia graves (acción de regreso, art. 36.2).",2],
  ["av-rk06","lrjsp2","En caso de daños físicos o psíquicos, el plazo de 1 año para reclamar responsabilidad patrimonial empieza a contar:",["Desde el día del hecho","Desde la curación o la determinación del alcance de las secuelas","Desde la primera visita médica","Desde que el interesado conoce al responsable"],1,"Art. 67.1 Ley 39/2015.",2],
  ["av-rk07","lrjsp2","En un procedimiento de responsabilidad patrimonial, transcurridos 6 meses sin resolución expresa:",["Se entiende estimada la reclamación","Se entiende desestimada la reclamación","Caduca el procedimiento","Prescribe el derecho"],1,"Art. 91.3 Ley 39/2015.",2],
  ["av-rk08","lrjsp2","El principio non bis in idem impide sancionar unos hechos ya sancionados penal o administrativamente cuando se aprecie identidad de:",["Sujeto y hecho","Sujeto, hecho y fundamento","Hecho y órgano sancionador","Sujeto, hecho y cuantía"],1,"Art. 31.1 Ley 40/2015.",2],

  // ---------- Administración electrónica (admelec) ----------
  ["av-ae01","admelec","Un interesado presenta su recurso en el registro electrónico a las 23:30 del último día del plazo, que es un martes hábil. ¿Está en plazo?",["No, el registro cierra a las 15:00","Sí: el registro electrónico permite presentar documentos todos los días del año durante las 24 horas","Solo si lo confirma el funcionario al día siguiente","No, se entiende presentado el miércoles"],1,"Art. 31.2 a) Ley 39/2015. Solo si se presenta en día inhábil se entiende hecho en la primera hora del primer día hábil siguiente.",2],
  ["av-ae02","admelec","Las Administraciones solo pueden exigir obligatoriamente la firma (no basta con identificarse) para:",["Cualquier consulta en la sede electrónica","Formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir y renunciar","Consultar el estado de un expediente","Acceder a las notificaciones"],1,"Art. 11.2 Ley 39/2015.",3],
  ["av-ae03","admelec","Las copias auténticas realizadas por una Administración Pública:",["Tienen menor valor probatorio que el original","Tienen la misma validez y eficacia que los documentos originales","Solo valen dentro de la misma Administración","Caducan a los 5 años"],1,"Art. 27.2 Ley 39/2015.",2],

  // ---------- Protección de datos (lopd) ----------
  ["av-pd01","lopd","El SERMAS, como Administración Pública, comete una infracción de protección de datos. Según la LO 3/2018, la sanción será:",["Multa de hasta 20 millones de euros","Multa del 4% de su presupuesto","Una resolución que declare la infracción, con apercibimiento","Ninguna, las Administraciones están exentas"],2,"Art. 77.2 LO 3/2018: a las Administraciones no se les imponen multas: se las sanciona con apercibimiento y, en su caso, se ordenan medidas para corregir la infracción.",3],
  ["av-pd02","lopd","Según la LO 3/2018, las infracciones muy graves, graves y leves prescriben, respectivamente, a los:",["3 años, 2 años y 1 año","3 años, 2 años y 6 meses","4 años, 2 años y 1 año","5 años, 3 años y 1 año"],0,"Arts. 72, 73 y 74 LO 3/2018. Ojo: en la Ley 40/2015 la infracción leve prescribe a los 6 meses.",3],
  ["av-pd03","lopd","El derecho a recibir tus datos en un formato estructurado, de uso común y lectura mecánica, y a transmitirlos a otro responsable es el derecho de:",["Acceso","Rectificación","Portabilidad","Oposición"],2,"Art. 20 RGPD.",2],
  ["av-pd04","lopd","Según la LO 3/2018, ¿quién está obligado a designar un delegado de protección de datos?",["Un médico que ejerce su profesión a título individual","Un centro sanitario legalmente obligado a mantener historias clínicas","Una comunidad de propietarios","Un pequeño comercio de barrio"],1,"Art. 34.1 LO 3/2018; quedan fuera los profesionales sanitarios que ejerzan a título individual.",3],
  ["av-pd05","lopd","Los datos relativos a la salud son, según el RGPD:",["Datos ordinarios","Categorías especiales de datos, cuyo tratamiento está prohibido salvo las excepciones del art. 9.2","Datos públicos","Datos solo protegidos si son genéticos"],1,"Art. 9 RGPD.",2],

  // ---------- Transparencia (transp) ----------
  ["av-tr01","transp","Quien pide acceso a información pública:",["Debe motivar siempre su solicitud","No está obligado a motivarla, aunque puede exponer los motivos","Debe acreditar un interés legítimo","Debe ser interesado en un procedimiento"],1,"Art. 17.3 Ley 19/2013.",2],
  ["av-tr02","transp","Si la información solicitada puede afectar a derechos de terceros identificados:",["Se deniega directamente","Se les concede 15 días para alegar, y el plazo para resolver se suspende mientras tanto","Se concede sin oírles","Se les da 1 mes y el plazo sigue corriendo"],1,"Art. 19.3 Ley 19/2013.",3],
  ["av-tr03","transp","Según la Ley 19/2013, la reclamación ante el Consejo de Transparencia y Buen Gobierno:",["Es obligatoria antes del contencioso y se presenta en 15 días","Es potestativa, se presenta en 1 mes y, si no se resuelve en 3 meses, se entiende desestimada","Es potestativa y el silencio es estimatorio","Sustituye al recurso de alzada y se presenta en 3 meses"],1,"Art. 24 Ley 19/2013.",3],
  ["av-tr04","transp","Se inadmite una solicitud de acceso que pide:",["El presupuesto aprobado de un hospital","Los borradores y notas internas de un informe","Los contratos adjudicados el último año","Las retribuciones de los altos cargos"],1,"Art. 18.1 b) Ley 19/2013: información de carácter auxiliar o de apoyo (notas, borradores, opiniones, resúmenes, comunicaciones e informes internos).",2],

  // ---------- Constitución (ce y ce2) ----------
  ["av-ce01","ce","Para reformar el art. 14 CE (igualdad ante la ley) el procedimiento es:",["El agravado del art. 168, porque está en el Título I","El ordinario del art. 167, porque el art. 14 no forma parte de la Sección 1.ª del Capítulo II","Ley orgánica por mayoría absoluta","Referéndum consultivo"],1,"El art. 168 protege la Sección 1.ª del Capítulo II (arts. 15-29), el Título Preliminar, el Título II y la revisión total. El art. 14 está en el Capítulo II pero antes de esa sección.",3],
  ["av-ce02","ce","¿Cuál de estos artículos solo puede reformarse por el procedimiento agravado del art. 168 CE?",["Art. 14 (igualdad)","Art. 27 (educación)","Art. 31 (deber de contribuir)","Art. 43 (protección de la salud)"],1,"El art. 27 está en la Sección 1.ª del Capítulo II. El 14 queda fuera de esa sección, el 31 está en la Sección 2.ª y el 43 en el Capítulo III.",3],
  ["av-ce03","ce2","¿Quién NO está legitimado para interponer un recurso de inconstitucionalidad?",["El Defensor del Pueblo","50 senadores","El Ministerio Fiscal","El Consejo de Gobierno de una Comunidad Autónoma"],2,"Art. 162.1 a) CE. El Ministerio Fiscal sí puede interponer recurso de amparo (art. 162.1 b), pero no de inconstitucionalidad.",3],
  ["av-ce04","ce","El derecho a la protección de la salud del art. 43 CE:",["Puede defenderse mediante recurso de amparo","Solo puede alegarse ante la jurisdicción ordinaria de acuerdo con las leyes que lo desarrollen","No vincula a los poderes públicos","Es un derecho fundamental de la Sección 1.ª"],1,"Art. 53.3 CE: los principios rectores del Capítulo III informan la legislación y la actuación de los poderes públicos, pero solo se alegan según lo que dispongan las leyes que los desarrollen.",3],
  ["av-ce05","ce2","Para autorizar al Gobierno a refundir varios textos legales en uno solo (como el TREBEP), las Cortes deben aprobar:",["Una ley de bases","Una ley ordinaria","Una ley orgánica","Un decreto-ley"],1,"Art. 82.2 CE: ley de bases para textos articulados; ley ordinaria para textos refundidos.",3],
  ["av-ce06","ce2","El estado de excepción:",["Lo declara el Gobierno por decreto, por 15 días, dando cuenta al Congreso","Lo declara el Gobierno previa autorización del Congreso, por un máximo de 30 días prorrogables por otro plazo igual","Lo declara el Congreso por mayoría absoluta a propuesta del Gobierno","Lo declara el Rey a propuesta del Senado"],1,"Art. 116.3 CE. La primera opción describe el estado de alarma y la tercera, el de sitio.",3],
  ["av-ce07","ce2","Un decreto-ley NO puede afectar a:",["Medidas económicas urgentes","El derecho electoral general","La organización de un organismo autónomo","Ayudas urgentes por una catástrofe natural"],1,"Art. 86.1 CE: no puede afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título I, al régimen de las Comunidades Autónomas ni al derecho electoral general.",2],
  ["av-ce08","ce2","Señale la afirmación correcta:",["La moción de censura exige mayoría simple y la cuestión de confianza, mayoría absoluta","La moción de censura exige mayoría absoluta del Congreso y la cuestión de confianza, mayoría simple","Ambas exigen mayoría absoluta","Ambas exigen mayoría simple"],1,"Arts. 112 y 113 CE. La moción la proponen al menos una décima parte de los diputados, con un candidato, y no puede votarse hasta 5 días después de presentarse.",3],
  ["av-ce09","ce2","De los 12 magistrados del Tribunal Constitucional, el Gobierno y el Consejo General del Poder Judicial proponen:",["4 y 4","2 y 2","3 y 3","4 y 2"],1,"Art. 159.1 CE: 4 a propuesta del Congreso, 4 del Senado (ambos por 3/5), 2 del Gobierno y 2 del CGPJ.",2],

  // ---------- TREBEP (ebep) ----------
  ["av-eb01","ebep","Un funcionario interino nombrado por exceso o acumulación de tareas puede estar, como máximo:",["6 meses en un periodo de 12","9 meses en un periodo de 18","3 años","1 año"],1,"Art. 10.1 d) TREBEP (redacción de la Ley 20/2021).",3],
  ["av-eb02","ebep","Un interino nombrado para ejecutar un programa de carácter temporal puede estar, como máximo:",["9 meses","3 años, ampliable hasta 12 meses más por las leyes de función pública","2 años improrrogables","Lo que dure el programa, sin límite"],1,"Art. 10.1 c) TREBEP.",3],
  ["av-eb03","ebep","La suspensión provisional de un funcionario como medida cautelar en un expediente disciplinario no puede exceder de:",["3 meses","6 meses, salvo paralización del procedimiento imputable al interesado","1 año","6 años"],1,"Art. 98.3 TREBEP. Los 6 años son el máximo de la suspensión firme como sanción (art. 96.1 c).",3],
  ["av-eb04","ebep","La edad mínima para acceder al empleo público es:",["16 años","18 años","La mayoría de edad o emancipación","14 años"],0,"Art. 56.1 c) TREBEP: tener 16 años y no exceder la edad máxima de jubilación forzosa.",2],
  ["av-eb05","ebep","¿Cuál NO es causa de pérdida de la condición de funcionario de carrera?",["La renuncia","La pérdida de la nacionalidad","La jubilación total","La sanción firme de suspensión de funciones"],3,"Art. 63 TREBEP. La suspensión firme no hace perder la condición; sí la separación del servicio.",2],
  ["av-eb06","ebep","Para pasar a excedencia voluntaria por interés particular, el funcionario debe haber prestado servicios efectivos en cualquier Administración durante:",["1 año","3 años","Los 5 años inmediatamente anteriores","10 años"],2,"Art. 89.2 TREBEP. No se devengan retribuciones ni se computa el tiempo.",2],

  // ---------- Estatuto Marco (em1) ----------
  ["av-em01","em1","Para cubrir las vacaciones de un celador estatutario fijo se expide un nombramiento:",["De interinidad","Eventual","De sustitución","De comisión de servicios"],2,"Art. 9.4 Ley 55/2003: el nombramiento de sustitución cubre vacaciones, permisos y demás ausencias temporales con reserva de plaza.",2],
  ["av-em02","em1","Un hospital necesita reforzar admisión durante unos meses por un aumento coyuntural de actividad. El nombramiento adecuado es:",["De interinidad","Eventual","De sustitución","De promoción interna temporal"],1,"Art. 9.3 Ley 55/2003: el nombramiento eventual se usa para servicios de carácter temporal, coyuntural o extraordinario.",2],

  // ---------- Contrato de trabajo (contrato) ----------
  ["av-ct01","contrato","Un trabajador encadena contratos por circunstancias de la producción. Adquiere la condición de fijo si, en un periodo de 24 meses, ha estado contratado más de:",["12 meses","18 meses","20 meses","24 meses"],1,"Art. 15.5 Estatuto de los Trabajadores (tras el RDL 32/2021), con dos o más contratos, con o sin solución de continuidad.",3],
  ["av-ct02","contrato","El contrato por circunstancias de la producción por incremento ocasional e imprevisible de la actividad dura, como máximo:",["3 meses","6 meses, ampliable a 1 año por convenio sectorial","1 año, ampliable a 18 meses","90 días al año"],1,"Art. 15.2 ET. Los 90 días en el año natural son para las situaciones ocasionales previsibles y de duración reducida.",3],
  ["av-ct03","contrato","En un contrato temporal de 5 meses, si el convenio no dice nada, el periodo de prueba no puede exceder de:",["15 días","1 mes","2 meses","6 meses"],1,"Art. 14.1 ET: en los contratos temporales del art. 15 de duración no superior a 6 meses, el periodo de prueba máximo es de 1 mes, salvo convenio.",3],
  ["av-ct04","contrato","La indemnización por despido improcedente (contratos posteriores a la reforma de 2012) es de:",["20 días por año, con un máximo de 12 mensualidades","33 días por año, con un máximo de 24 mensualidades","45 días por año, con un máximo de 42 mensualidades","12 días por año"],1,"Art. 56.1 ET. 20 días/12 mensualidades es el despido objetivo procedente y 12 días, el fin de un contrato temporal.",2],

  // ---------- Prevención (prl) ----------
  ["av-pr01","prl","Un hospital tiene 650 trabajadores. ¿Cuántos Delegados de Prevención le corresponden?",["3","4","5","6"],1,"Art. 35.2 Ley 31/1995: de 501 a 1.000 trabajadores, 4 delegados (50-100: 2; 101-500: 3; 1.001-2.000: 5).",3],
  ["av-pr02","prl","El tiempo que los Delegados de Prevención dedican a las reuniones del Comité de Seguridad y Salud:",["Se descuenta de su crédito horario","Es tiempo de trabajo efectivo sin imputarse al crédito horario","No se retribuye","Se compensa con días libres"],1,"Art. 37.1 Ley 31/1995.",3],
  ["av-pr03","prl","El Comité de Seguridad y Salud:",["Lo forman solo los Delegados de Prevención y se reúne mensualmente","Es paritario y se reúne trimestralmente y siempre que lo pida alguna de las representaciones","Lo preside siempre un inspector de trabajo","Se reúne una vez al año"],1,"Art. 38 Ley 31/1995.",2],
  ["av-pr04","prl","Según los principios de la acción preventiva, el empresario debe:",["Anteponer la protección individual a la colectiva","Anteponer la protección colectiva a la individual","Evaluar primero los riesgos que se pueden evitar","Adaptar la persona al trabajo"],1,"Art. 15.1 h) Ley 31/1995. Primero se evitan los riesgos, se evalúan los que no se pueden evitar y se adapta el trabajo a la persona, no al revés.",2],

  // ---------- Seguridad Social (ss1 y ss2) ----------
  ["av-ss01","ss2","Agotados los 545 días de incapacidad temporal sin alta, los efectos de la situación pueden prorrogarse hasta la calificación de la incapacidad permanente, sin rebasar en ningún caso:",["600 días","730 días desde el inicio de la IT","3 años","No hay límite"],1,"Art. 174.5 LGSS.",3],
  ["av-ss02","ss2","Hay recaída en un mismo proceso de incapacidad temporal cuando se produce una nueva baja por la misma o similar patología dentro de los ___ siguientes al alta anterior:",["90 días naturales","180 días naturales","6 meses hábiles","365 días"],1,"Art. 169.2 LGSS: los periodos se suman a efectos de la duración máxima.",3],
  ["av-ss03","ss1","Una administrativa tiene un accidente de tráfico yendo de casa al hospital. Ese accidente es:",["Accidente no laboral","Accidente de trabajo «in itinere»","Enfermedad profesional","Enfermedad común"],1,"Art. 156.2 a) LGSS.",2],
  ["av-ss04","ss2","Para cobrar la incapacidad temporal derivada de enfermedad común se exige haber cotizado:",["No se exige carencia","180 días dentro de los 5 años inmediatamente anteriores","1 año en los últimos 3","15 años"],1,"Art. 172 a) LGSS. Si deriva de accidente (laboral o no) o de enfermedad profesional no se exige carencia.",2],
  ["av-ss05","ss2","A un trabajador de 50 años se le declara una incapacidad permanente total para su profesión habitual. Su pensión es, con carácter general, del:",["55% de la base reguladora","75% de la base reguladora","100% de la base reguladora","100% más un complemento"],0,"La IP total se paga al 55%; el 20% adicional («total cualificada») exige tener 55 años o más. La absoluta es el 100% y la gran invalidez añade un complemento.",3],

  // ---------- Autonomía del paciente (ley41) ----------
  ["av-pa01","ley41","Un paciente de 17 años, no emancipado, necesita una intervención que, según el médico, supone un grave riesgo para su vida. ¿Quién presta el consentimiento?",["El propio paciente, por tener más de 16 años","El representante legal, una vez oída y tenida en cuenta la opinión del menor","El juez, siempre","El médico responsable"],1,"Art. 9.4 Ley 41/2002 (tras la Ley 26/2015).",3],
  ["av-pa02","ley41","El personal de administración y gestión de un hospital puede acceder a la historia clínica:",["Libremente, por trabajar en el centro","Solo a los datos relacionados con sus propias funciones","Nunca","Solo con autorización judicial"],1,"Art. 16.4 Ley 41/2002. Es una pregunta muy probable para el puesto de Administrativo.",2],
  ["av-pa03","ley41","Un paciente no acepta el tratamiento prescrito, pero sí un tratamiento alternativo paliativo que presta el centro. ¿Procede el alta forzosa?",["Sí, siempre que no acepte el tratamiento principal","No, si existen tratamientos alternativos que preste el centro y el paciente acepta recibirlos","Solo con autorización judicial previa","Sí, si el paciente no firma el alta voluntaria"],1,"Art. 21.1 Ley 41/2002.",3],
  ["av-pa04","ley41","Cuando por razones de salud pública se dispone el internamiento obligatorio de personas, hay que comunicarlo a la autoridad judicial en un plazo máximo de:",["24 horas","48 horas","72 horas","5 días"],0,"Art. 9.2 a) Ley 41/2002.",3],
  ["av-pa05","ley41","Tras el fallecimiento de un paciente, las personas vinculadas a él por razones familiares o de hecho:",["No pueden acceder nunca a su historia clínica","Pueden acceder, salvo que el fallecido lo hubiese prohibido expresamente y así se acredite","Pueden acceder a toda la historia, incluidas las anotaciones subjetivas","Solo pueden acceder con orden judicial"],1,"Art. 18.4 Ley 41/2002. Nunca se facilita información que afecte a la intimidad del fallecido, las anotaciones subjetivas ni la que perjudique a terceros.",3],
  ["av-pa06","ley41","Sobre el documento de instrucciones previas, señale la INCORRECTA:",["Lo otorga una persona mayor de edad, capaz y libre","Debe constar siempre por escrito","Puede revocarse libremente en cualquier momento, dejando constancia por escrito","Se aplica aunque sea contrario a la lex artis si así lo quiso el paciente"],3,"Art. 11.3 Ley 41/2002: no se aplican las instrucciones contrarias al ordenamiento, a la lex artis ni las que no se correspondan con el supuesto de hecho previsto.",2],
  ["av-pa07","ley41","El médico limita la información al paciente porque conocer su situación podría perjudicar gravemente su salud. Esa situación se llama:",["Privilegio terapéutico voluntario","Estado de necesidad terapéutica","Renuncia a la información","Consentimiento presunto"],1,"Art. 5.4 Ley 41/2002: el médico lo hace constar razonadamente en la historia y lo comunica a las personas vinculadas al paciente.",3],

  // ---------- Ley General de Sanidad (lgs) ----------
  ["av-lg01","lgs","Sobre la población de las Áreas de Salud, señale la correcta:",["Es siempre de 200.000 a 250.000 habitantes, sin excepciones","Es la regla general, con excepciones, y en todo caso cada provincia tendrá como mínimo un Área","Cada Área atiende como mínimo a 500.000 habitantes","La fija cada hospital"],1,"Art. 56.5 Ley 14/1986: la propia ley exceptúa Baleares, Canarias, Ceuta y Melilla.",2],
  ["av-lg02","lgs","Según el art. 149.1.16.ª CE, es competencia exclusiva del Estado:",["La gestión de los hospitales","La sanidad exterior","La atención primaria","La gestión de los centros de salud de cada comunidad"],1,"El Estado tiene competencia exclusiva sobre sanidad exterior, bases y coordinación general de la sanidad y legislación sobre productos farmacéuticos.",2],

  // ---------- Igualdad (igualdad) ----------
  ["av-ig01","igualdad","Están obligadas a elaborar y aplicar un plan de igualdad las empresas de:",["25 o más trabajadores","50 o más trabajadores","100 o más trabajadores","250 o más trabajadores"],1,"Art. 45.2 LO 3/2007 (redacción del RDL 6/2019).",2],

  const temaDe = (q) => TEMA_DE_MATERIA[q.m] || null;
  const preguntasDeTema = (n) => { const t = TEMAS.find((x) => x.n === n); return t ? PREGUNTAS.filter((q) => t.m.includes(q.m)) : []; };
  const bloqueDeTema = (n) => BLOQUES.find((b) => n >= b.temas[0] && n <= b.temas[1]);
  const temasDeBloque = (b) => TEMAS.filter((t) => t.n >= b.temas[0] && t.n <= b.temas[1]);
  const tieneResumen = (t) => t.m.some((m) => RESUMENES[m]);

  // ---------- Puntuación oficial ----------
  function puntuar(aciertos, fallos, total) {
    const neta = aciertos + fallos * EX.error;
    const nota = total ? Math.max(0, (neta / total) * EX.escala) : 0;
    return { neta, nota, aprobado: nota >= EX.corte };
  }

  // ---------- Almacenamiento (local + nube opcional) ----------
  const KEY = "sermasAdmin.v1";
  const vacio = () => ({ v: 1, upd: 0, preg: {}, tests: [], estudiados: {}, avisosVistos: {}, tarj: {} });
  let D = vacio();
  let memoriaSolo = false;

  function cargarLocal() {
    try { const s = localStorage.getItem(KEY); if (s) D = Object.assign(vacio(), JSON.parse(s)); }
    catch (e) { memoriaSolo = true; }
  }
  function guardar() {
    D.upd = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { memoriaSolo = true; }
    Nube.programar();
  }

  const Nube = {
    ref: null, timer: null, escribiendo: false, pendiente: false, estado: "local",
    async iniciar() {
      try {
        if (!window.claude || typeof window.claude.use !== "function") return;
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        this.ref = db.collection("data/users/" + id).doc("progreso");
        const snap = await Promise.race([this.ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
        const remoto = snap.exists ? snap.data() : null;
        if (remoto && remoto.json) {
          const r = JSON.parse(remoto.json);
          if ((r.upd || 0) > (D.upd || 0)) { D = Object.assign(vacio(), r); try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} render(); }
          else if ((D.upd || 0) > (r.upd || 0)) this.programar(0);
        } else if (D.upd) this.programar(0);
        this.estado = "nube"; pintarEstadoGuardado();
      } catch (e) { this.ref = null; this.estado = "local"; pintarEstadoGuardado(); }
    },
    programar(ms = 1500) {
      if (!this.ref) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.escribir(), ms);
    },
    async escribir() {
      if (!this.ref) return;
      if (this.escribiendo) { this.pendiente = true; return; }
      this.escribiendo = true;
      try { await this.ref.set({ json: JSON.stringify(D), upd: D.upd }); this.estado = "nube"; }
      catch (e) { if (e && e.code === "invalid_argument") { this.ref = null; } this.estado = "local"; }
      this.escribiendo = false; pintarEstadoGuardado();
      if (this.pendiente) { this.pendiente = false; this.escribir(); }
    }
  };

  function pintarEstadoGuardado() {
    const el = $("#guardado");
    if (!el) return;
    if (Nube.estado === "nube") { el.textContent = "Progreso sincronizado"; el.title = "Tu progreso se guarda en tu cuenta y lo verás en cualquier dispositivo."; }
    else if (memoriaSolo) { el.textContent = "Progreso solo en esta sesión"; el.title = "Este navegador no permite guardar datos: el progreso se perderá al cerrar."; }
    else { el.textContent = "Progreso guardado en este dispositivo"; el.title = ""; }
  }

  // ---------- Estadísticas derivadas ----------
  function statsPregunta(id) { return D.preg[id] || { n: 0, ok: 0, ko: 0, bl: 0, last: null }; }
  function statsTema(n) {
    const qs = preguntasDeTema(n);
    let vistas = 0, ok = 0, ko = 0, bl = 0, resp = 0;
    qs.forEach((q) => { const s = D.preg[q.id]; if (s && s.n) { vistas++; ok += s.ok; ko += s.ko; bl += s.bl; resp += s.n; } });
    return { total: qs.length, vistas, ok, ko, bl, resp, acierto: pct(ok, resp) };
  }
  function statsGlobal() {
    let ok = 0, ko = 0, bl = 0;
    Object.values(D.preg).forEach((s) => { ok += s.ok; ko += s.ko; bl += s.bl; });
    const total = ok + ko + bl;
    return { ok, ko, bl, total, vistas: Object.keys(D.preg).length };
  }
  const pendientesRepaso = () => Object.entries(D.preg).filter(([id, s]) => Q_BY_ID[id] && (s.last === "ko" || s.last === "bl")).map(([id]) => id);

  // ---------- Pantalla: ancho, giro y altura de cabecera ----------
  const MQ_ANCHO = window.matchMedia("(min-width: 900px)");
  const esAncho = () => MQ_ANCHO.matches;
  function fijarAlturaCabecera() {
    const cab = document.querySelector(".top");
    if (!cab) return;
    const fija = getComputedStyle(cab).position === "sticky";
    document.documentElement.style.setProperty("--cab-h", (fija ? cab.offsetHeight : 0) + "px");
  }
  function alGirar() {
    fijarAlturaCabecera();
    // El test cambia de una a dos columnas según el ancho: se vuelve a pintar sin perder nada.
    if (TEST && location.hash === "#hacer") $("#app").innerHTML = vHacer();
  }
  if (MQ_ANCHO.addEventListener) MQ_ANCHO.addEventListener("change", alGirar);
  window.addEventListener("resize", fijarAlturaCabecera);
  window.addEventListener("orientationchange", () => setTimeout(alGirar, 250));

  // ---------- Estado de la vista ----------
  let TEST = null;      // test en curso
  let relojId = null;
  let filtroRevision = "todas";

  // ---------- Router ----------
  function ir(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  window.addEventListener("hashchange", render);

  function render() {
    const h = location.hash.replace(/^#/, "") || "inicio";
    const cut = h.indexOf("-"); const vista = cut < 0 ? h : h.slice(0, cut); const arg = cut < 0 ? undefined : h.slice(cut + 1);
    const seccion = vista === "tema" ? "temario" : vista === "resultado" || vista === "hacer" ? "test" : vista === "tabla" || vista === "tarjetas" ? "repaso" : vista;
    document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("activo", a.dataset.v === seccion));
    pararReloj();
    if (vista !== "tarjetas") SES = null;
    const app = $("#app");
    if (vista === "temario") app.innerHTML = vTemario();
    else if (vista === "tema") app.innerHTML = vTema(parseInt(arg, 10));
    else if (vista === "test") app.innerHTML = vConfigTest(arg);
    else if (vista === "hacer") { if (!TEST) return ir("#test"); app.innerHTML = vHacer(); iniciarReloj(); }
    else if (vista === "resultado") app.innerHTML = vResultado(parseInt(arg, 10));
    else if (vista === "estadisticas") app.innerHTML = vEstadisticas();
    else if (vista === "fallos") app.innerHTML = vFallos();
    else if (vista === "repaso") app.innerHTML = vRepaso(arg || "tarjetas");
    else if (vista === "tabla") app.innerHTML = vTablaSola(arg);
    else if (vista === "tarjetas") { if (!SES) return ir("#repaso"); app.innerHTML = vTarjeta(); }
    else app.innerHTML = vInicio();
    pintarAviso();
    pintarTestPendiente(vista);
    pintarEstadoGuardado();
    if (vista !== "hacer") window.scrollTo(0, 0);
  }

  // ---------- Aviso de test a medias ----------
  function pintarTestPendiente(vista) {
    const el = $("#aviso-app");
    if (!el) return;
    if (!TEST || vista === "hacer") { el.innerHTML = ""; return; }
    const resp = TEST.resp.filter((r) => r !== null).length;
    el.innerHTML = `<div class="novedad" role="status"><div><strong>Tienes un test a medias: ${esc(TEST.titulo)}</strong><p>${resp} de ${TEST.ids.length} respondidas${TEST.limite ? " · el cronómetro sigue corriendo" : ""}.</p></div><div class="acc-dialogo"><button class="btn peq" data-go="#hacer">Continuar</button><button class="btn sec peq" data-act="descartar-test">Descartar</button></div></div>`;
  }

  // ---------- Aviso de versión del temario ----------
  function pintarAviso() {
    const el = $("#aviso");
    const v = VERSION_TEMARIO;
    const nov = v.novedad && !D.avisosVistos[v.id];
    el.innerHTML = `
      ${nov ? `<div class="novedad" role="status"><div><strong>${esc(v.novedad.titulo)}</strong><p>${esc(v.novedad.texto)}</p></div><button class="btn sec peq" data-act="cerrar-novedad">Entendido</button></div>` : ""}
      <div class="version ${v.estado === "oficial" ? "ok" : "prov"}">
        <span class="punto"></span>
        <span><strong>${esc(v.etiqueta)}</strong> · actualizado el ${esc(new Date(v.actualizado + "T12:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }))}</span>
        <button class="enlace" data-act="info-version">Más información</button>
      </div>
      <div class="info-version" id="info-version" hidden>${esc(v.detalle)}</div>`;

  // ---------- Vistas ----------
  function vInicio() {
    const g = statsGlobal();
    const estudiados = Object.keys(D.estudiados).filter((k) => D.estudiados[k]).length;
    const fallos = pendientesRepaso().length;
    const ultimos = D.tests.slice(-5).reverse();

    return `
    <section class="hero">
      <div>
        <p class="sup">Oposición · Grupo C1 · Turno libre</p>
        <h1>Administrativo de la Función Administrativa del SERMAS</h1>

      ${kpi("Aciertos", g.total ? pct(g.ok, g.total) + "%" : "—", g.total ? `${pct(g.ko, g.total)}% fallos · ${pct(g.bl, g.total)}% en blanco` : "Aún no has hecho ningún test", "ok")}
      ${kpi("Nota media en simulacros", notaMediaSim !== null ? fmt1(notaMediaSim) + " / 50" : "—", notaMediaSim !== null ? (notaMediaSim >= EX.corte ? "Por encima del corte (25)" : "Por debajo del corte (25)") : "Haz un simulacro completo", notaMediaSim !== null && notaMediaSim >= EX.corte ? "ok" : "")}
      ${kpi("Temas estudiados", `${estudiados} / ${TEMAS.length}`, "Márcalos desde cada resumen")}
    </section>

    <div class="grid2">
      <section class="card">

          <a class="accion" href="#temario"><span class="ico">📘</span><span><strong>Temario y resúmenes</strong><small>${TEMAS.filter(tieneResumen).length} temas con resumen</small></span></a>
          <button class="accion destacada" data-act="tarj-hoy"><span class="ico">🧠</span><span><strong>Repaso con tarjetas</strong><small>${tarjetasPendientes().length ? tarjetasPendientes().length + " tarjetas para repasar hoy" : "Al día: nada pendiente para hoy"}</small></span></button>
          <a class="accion" href="#test"><span class="ico">✍️</span><span><strong>Hacer un test</strong><small>Por tema, por bloque o aleatorio</small></span></a>
          <a class="accion" href="#fallos"><span class="ico">🔁</span><span><strong>Repasar fallos</strong><small>${fallos ? fallos + " preguntas pendientes" : "No tienes fallos pendientes"}</small></span></a>
          <a class="accion" href="#estadisticas"><span class="ico">📊</span><span><strong>Estadísticas</strong><small>Tu evolución por tema</small></span></a>
        </div>
      </section>
      <section class="card">
        <h2>El examen</h2>
        <ul class="datos">
          <li><span>Formato</span><strong>${EX.preguntas} preguntas + ${EX.reserva} de reserva</strong></li>
          <li><span>Tiempo</span><strong>${EX.minutos} minutos</strong></li>
          <li><span>Puntuación</span><strong>+1 acierto · −0,25 fallo · 0 en blanco</strong></li>
          <li><span>Nota</span><strong>Sobre ${EX.escala} · corte en ${EX.corte}</strong></li>
          <li><span>Plazo de solicitudes</span><strong>${diasPlazo > 0 ? `Hasta el 9 de diciembre de 2026 (quedan ${diasPlazo} días)` : "Cerrado (9 de diciembre de 2026)"}</strong></li>
          <li><span>Fecha del examen</span><strong>${CONVOCATORIA.fechaExamen ? esc(CONVOCATORIA.fechaExamen) : "Pendiente de publicar"}</strong></li>
        </ul>
      </section>
    </div>

    <section class="card">
      <h2>Últimos tests</h2>
      ${ultimos.length ? tablaTests(ultimos) : `<p class="vacio">Todavía no has hecho ningún test. Empieza con un <button class="enlace" data-act="rapido">test rápido de 10 preguntas</button>.</p>`}
    </section>`;
  }

  function kpi(titulo, valor, pie, tono = "") {
    return `<div class="kpi ${tono}"><span>${esc(titulo)}</span><strong>${esc(String(valor))}</strong><small>${esc(pie)}</small></div>`;
  }

  function tablaTests(lista) {
    return `<div class="tabla-wrap"><table class="tabla">
      <thead><tr><th>Fecha</th><th>Test</th><th class="num">Aciertos</th><th class="num">Fallos</th><th class="num">Blanco</th><th class="num">Nota /50</th><th></th></tr></thead>
      <tbody>${lista.map((t) => `<tr>
        <td>${fechaCorta(t.fecha)} <small>${horaCorta(t.fecha)}</small></td>

      </tbody></table></div>`;

  function vTemario() {
    return `

    <div class="buscador"><input id="buscar" type="search" placeholder="Buscar tema o ley (p. ej. «39/2015», «contratos»)" aria-label="Buscar en el temario"></div>

                </span>

  }

        ${r.secciones.map((sec) => `<section><h2>${esc(sec.t)}</h2><ul>${sec.p.map((p) => `<li>${md(p)}</li>`).join("")}</ul></section>`).join("")}

  // ---------- Configuración de test ----------
  let CFG = { modo: "aleatorio", tema: 1, bloque: "B1", nivel: "todos", num: 20, correccion: "final", tiempo: true };
  const OPC_NIVEL = [["todos", "Todos", "Mezcla de todos los niveles"], ["1", "Básico", "Conceptos y datos clave"], ["2", "Intermedio-avanzado", "Matices y excepciones"], ["3", "Avanzado", "Estilo examinador"], ["dificil", "Mezcla exigente", "Intermedio-avanzado + avanzado"]];
  const filtraNivel = (qs) => CFG.nivel === "todos" ? qs : qs.filter((q) => CFG.nivel === "dificil" ? q.nv >= 2 : q.nv === Number(CFG.nivel));

  function vConfigTest(arg) {

    return `
    <div class="cab"><h1>Hacer un test</h1><p>Elige el tipo de test. La puntuación es la del examen real: +1 por acierto, −0,25 por fallo y 0 en blanco.</p></div>
    <section class="card">
      <h2>1. Tipo de test</h2>
