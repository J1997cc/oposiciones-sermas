      ${CFG.modo === "bloque" ? `<label class="campo">Bloque<select id="cfg-bloque">${BLOQUES.map((b) => `<option value="${b.id}" ${b.id === CFG.bloque ? "selected" : ""}>Bloque ${b.id.slice(1)}. ${esc(b.nombre)}</option>`).join("")}</select></label>` : ""}

      ${["aleatorio", "tema", "bloque"].includes(CFG.modo) ? `
      <h2>Dificultad</h2>
      <div class="opciones-modo" role="radiogroup" aria-label="Dificultad">
        ${OPC_NIVEL.map(([v, t, d]) => `<button role="radio" aria-checked="${CFG.nivel === v}" class="modo ${CFG.nivel === v ? "sel" : ""}" data-act="cfg-nivel" data-v="${v}"><strong>${t}</strong><small>${d}</small></button>`).join("")}
      </div>` : ""}

      ${CFG.modo !== "simulacro" ? `
      <h2>2. Número de preguntas</h2>
      <div class="segmentado">${[10, 20, 30, 50].map((n) => `<button class="${CFG.num === n ? "sel" : ""}" data-act="cfg-num" data-v="${n}">${n}</button>`).join("")}<button class="${CFG.num === 0 ? "sel" : ""}" data-act="cfg-num" data-v="0">Todas</button></div>
      <h2>3. Corrección</h2>
      <div class="segmentado">
        <button class="${CFG.correccion === "final" ? "sel" : ""}" data-act="cfg-corr" data-v="final">Al final (modo examen)</button>
        <button class="${CFG.correccion === "inmediata" ? "sel" : ""}" data-act="cfg-corr" data-v="inmediata">Al momento (modo estudio)</button>
      </div>
      <label class="check"><input type="checkbox" id="cfg-tiempo" ${CFG.tiempo ? "checked" : ""}> Cronometrar (tiempo proporcional al examen real: ${fmt1(EX.minutos / EX.preguntas * 60)} s por pregunta)</label>
      ` : `<div class="aviso-sim"><strong>Simulacro:</strong> ${Math.min(EX.preguntas, PREGUNTAS.length)} preguntas aleatorias de todo el temario en ${PREGUNTAS.length >= EX.preguntas ? EX.minutos : Math.round(EX.minutos / EX.preguntas * PREGUNTAS.length)} minutos, con corrección al final, como en el examen.${PREGUNTAS.length < EX.preguntas ? ` Ahora mismo hay ${PREGUNTAS.length} preguntas en el banco; el simulacro crecerá al añadir más.` : ""}</div>`}

      <div class="pie-cfg">
        <span class="disp">${disponibles} preguntas disponibles</span>
        <button class="btn grande" data-act="empezar" ${disponibles ? "" : "disabled"}>Empezar test</button>
      </div>
    </section>`;
  }

  function poolSegunCfg() {
    if (CFG.modo === "tema") return filtraNivel(preguntasDeTema(CFG.tema));
    if (CFG.modo === "bloque") { const b = BLOQUES.find((x) => x.id === CFG.bloque); return b ? filtraNivel(temasDeBloque(b).flatMap((t) => preguntasDeTema(t.n))) : []; }
    if (CFG.modo === "fallos") return pendientesRepaso().map((id) => Q_BY_ID[id]);
    if (CFG.modo === "simulacro") return PREGUNTAS.filter((q) => temaDe(q));
    return filtraNivel(PREGUNTAS.filter((q) => temaDe(q)));
  }

  function tituloCfg() {
    const n = ["aleatorio", "tema", "bloque"].includes(CFG.modo) && CFG.nivel !== "todos" ? " · " + OPC_NIVEL.find((x) => x[0] === CFG.nivel)[1] : "";
    return tituloBase() + n;
  }
  function tituloBase() {
    if (CFG.modo === "tema") return `Tema ${CFG.tema}`;
    if (CFG.modo === "bloque") return `Bloque ${CFG.bloque.slice(1)}`;
    if (CFG.modo === "fallos") return "Repaso de fallos";
    if (CFG.modo === "simulacro") return "Simulacro de examen";
    if (CFG.modo === "rapido") return "Test rápido";
    return "Test aleatorio";
  }

  function crearTest() {
    let pool = poolSegunCfg();
    let n, segundos, correccion;
    if (CFG.modo === "simulacro") {
      n = Math.min(EX.preguntas, pool.length);
      segundos = Math.round((EX.minutos * 60 / EX.preguntas) * n);
      correccion = "final";
    } else {
      n = CFG.num === 0 ? pool.length : Math.min(CFG.num, pool.length);
      segundos = CFG.tiempo ? Math.round((EX.minutos * 60 / EX.preguntas) * n) : null;
      correccion = CFG.correccion;
    }
    // Prioriza preguntas nunca vistas y falladas para que el estudio avance.
    const peso = (q) => { const s = D.preg[q.id]; if (!s || !s.n) return 0; if (s.last !== "ok") return 1; return 2; };
    pool = shuffle(pool).sort((a, b) => peso(a) - peso(b));
    const elegidas = shuffle(pool.slice(0, n));
    TEST = {
      modo: CFG.modo, titulo: tituloCfg(), correccion,
      ids: elegidas.map((q) => q.id),
      orden: elegidas.map(() => shuffle([0, 1, 2, 3])),
      resp: elegidas.map(() => null),
      bloqueadas: elegidas.map(() => false),
      marcadas: elegidas.map(() => false),
      idx: 0, inicio: Date.now(), limite: segundos
    };
    ir("#hacer");
  }

  // ---------- Hacer test ----------
  function vHacer() {
    const T = TEST, i = T.idx, q = Q_BY_ID[T.ids[i]], total = T.ids.length;
    const respondidas = T.resp.filter((r) => r !== null).length;
    const bloq = T.bloqueadas[i];
    const tn = temaDe(q);
    return `
    <div class="test-top">
      <div><strong>${esc(T.titulo)}</strong><small>Pregunta ${i + 1} de ${total} · ${respondidas} respondidas</small></div>
      <div class="reloj ${T.limite ? "" : "oculto"}" id="reloj" aria-live="off">${T.limite ? mmss(T.limite - (Date.now() - T.inicio) / 1000) : ""}</div>
      <button class="btn sec peq" data-act="terminar">Terminar y corregir</button>
    </div>
    <div class="barra"><span style="width:${pct(respondidas, total)}%"></span></div>
    <div class="test-grid"><div class="test-main">
    <article class="pregunta">
      <p class="q-meta">Tema ${tn} · ${NIVELES[q.nv]}${T.marcadas[i] ? ` · <span class="marca">★ Marcada para revisar</span>` : ""}</p>
      <h2 class="q-txt">${esc(q.q)}</h2>
      <div class="opts" role="radiogroup" aria-label="Respuestas">
        ${T.orden[i].map((oi, k) => {
          const sel = T.resp[i] === oi;
          let cls = sel ? "sel" : "";
          if (bloq) { if (oi === q.a) cls = "correcta"; else if (sel) cls = "incorrecta"; }
          return `<button class="opt ${cls}" role="radio" aria-checked="${sel}" data-act="responder" data-oi="${oi}" ${bloq ? "disabled" : ""}><span class="letra">${LETRAS[k]}</span><span>${esc(q.o[oi])}</span></button>`;
        }).join("")}
      </div>
      ${bloq ? `<div class="explic ${T.resp[i] === q.a ? "ok" : "ko"}"><strong>${T.resp[i] === q.a ? "¡Correcto!" : T.resp[i] === null ? "En blanco" : "Incorrecto"}</strong> ${esc(q.e)}</div>` : ""}
    </article>
    <div class="test-nav">
      <button class="btn sec" data-act="anterior" ${i === 0 ? "disabled" : ""}>← Anterior</button>
      <div class="test-nav-mid">
        ${!bloq && T.resp[i] !== null ? `<button class="enlace" data-act="borrar">Dejar en blanco</button>` : ""}
        <button class="enlace" data-act="marcar">${T.marcadas[i] ? "Quitar marca" : "★ Marcar"}</button>
      </div>
      ${i < total - 1 ? `<button class="btn" data-act="siguiente">Siguiente →</button>` : `<button class="btn" data-act="terminar">Terminar y corregir</button>`}
    </div>
    </div><aside class="test-side">
    <details class="mapa" ${total <= 30 || esAncho() ? "open" : ""}>
      <summary>Mapa de preguntas</summary>
      <div class="mapa-grid">${T.ids.map((id, k) => {
        let c = T.resp[k] !== null ? "resp" : "";
        if (T.bloqueadas[k]) c = T.resp[k] === Q_BY_ID[id].a ? "bien" : "mal";
        return `<button class="${c} ${k === i ? "actual" : ""} ${T.marcadas[k] ? "marc" : ""}" data-act="saltar" data-k="${k}" aria-label="Pregunta ${k + 1}">${k + 1}</button>`;
      }).join("")}</div>
    </details>
    </aside></div>`;
  }

  function iniciarReloj() {
    if (!TEST || !TEST.limite) return;
    relojId = setInterval(() => {
      const rest = TEST.limite - (Date.now() - TEST.inicio) / 1000;
      const el = $("#reloj");
      if (el) { el.textContent = mmss(rest); el.classList.toggle("urgente", rest < 60); }
      if (rest <= 0) { pararReloj(); finalizarTest(true); }
    }, 500);
  }
  function pararReloj() { if (relojId) { clearInterval(relojId); relojId = null; } }

  function finalizarTest(porTiempo = false) {
    const T = TEST; if (!T) return;
    let a = 0, f = 0, b = 0;
    const detalle = T.ids.map((id, k) => {
      const q = Q_BY_ID[id], r = T.resp[k];
      const res = r === null ? "bl" : r === q.a ? "ok" : "ko";
      if (res === "ok") a++; else if (res === "ko") f++; else b++;
      const s = D.preg[id] || { n: 0, ok: 0, ko: 0, bl: 0, last: null };
      s.n++; s[res]++; s.last = res; s.t = Date.now();
      D.preg[id] = s;
      return [id, r === null ? -1 : r, T.orden[k]];
    });
    const p = puntuar(a, f, T.ids.length);
    D.tests.push({ fecha: Date.now(), modo: T.modo, titulo: T.titulo, n: T.ids.length, a, f, b, neta: p.neta, nota: p.nota, dur: Math.round((Date.now() - T.inicio) / 1000), porTiempo, det: detalle });
    if (D.tests.length > 60) D.tests = D.tests.slice(-60);
    guardar();
    TEST = null;
    filtroRevision = "todas";
    ir("#resultado-" + (D.tests.length - 1));
  }

  // ---------- Resultado y corrección ----------
  function vResultado(idx) {
    const t = D.tests[idx];
    if (!t) return `<p>No se encuentra ese test. <a href="#estadisticas">Ver historial</a></p>`;
    const items = t.det.map(([id, r, ord]) => ({ q: Q_BY_ID[id], r, ord: Array.isArray(ord) && ord.length === 4 ? ord : [0, 1, 2, 3] })).filter((x) => x.q);
    const porTema = {};
    items.forEach(({ q, r }) => { const n = temaDe(q); porTema[n] = porTema[n] || { ok: 0, ko: 0, bl: 0 }; porTema[n][r === -1 ? "bl" : r === q.a ? "ok" : "ko"]++; });
    const filtrados = items.filter(({ q, r }) => filtroRevision === "todas" || (filtroRevision === "ko" && r !== -1 && r !== q.a) || (filtroRevision === "bl" && r === -1) || (filtroRevision === "ok" && r === q.a));
    const aprob = t.nota >= EX.corte;
    return `
    <div class="cab"><p class="sup">${fechaCorta(t.fecha)} · ${horaCorta(t.fecha)} · ${mmss(t.dur)} min${t.porTiempo ? " · terminado por tiempo" : ""}</p><h1>Resultado: ${esc(t.titulo)}</h1></div>
    <section class="resultado">
      <div class="nota-grande ${aprob ? "ok" : "ko"}">
        <span>Nota</span><strong>${fmt1(t.nota)}</strong><small>sobre ${EX.escala} · ${aprob ? "aprobado (≥ 25)" : "por debajo del corte (25)"}</small>
      </div>
      <div class="res-datos">
        <div class="res-barra" role="img" aria-label="${t.a} aciertos, ${t.f} fallos y ${t.b} en blanco">
          <span class="b-ok" style="flex:${t.a}"></span><span class="b-ko" style="flex:${t.f}"></span><span class="b-bl" style="flex:${t.b}"></span>
        </div>
        <div class="res-kpis">
          <div class="ok-t"><strong>${t.a}</strong><span>Aciertos · ${pct(t.a, t.n)}%</span></div>
          <div class="ko-t"><strong>${t.f}</strong><span>Fallos · ${pct(t.f, t.n)}%</span></div>
          <div><strong>${t.b}</strong><span>En blanco · ${pct(t.b, t.n)}%</span></div>
          <div><strong>${fmt1(t.neta)}</strong><span>Puntos netos (${t.a} − ${t.f} × 0,25)</span></div>
        </div>
        <p class="nota-calc">Cálculo: (${fmt1(t.neta)} ÷ ${t.n}) × ${EX.escala} = <strong>${fmt1(t.nota)}</strong>. ${t.f ? `Los fallos te han restado ${fmt1(t.f * 0.25)} puntos netos.` : "Sin penalización por fallos."}</p>
      </div>
    </section>

    <section class="card">
      <h2>Por tema</h2>
      <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Tema</th><th class="num">Aciertos</th><th class="num">Fallos</th><th class="num">Blanco</th><th class="num">% acierto</th></tr></thead>
      <tbody>${Object.entries(porTema).sort((x, y) => x[0] - y[0]).map(([n, s]) => { const tot = s.ok + s.ko + s.bl; const tt = TEMAS.find((x) => x.n == n); return `<tr><td><a href="#tema-${n}">Tema ${n}</a> <small>${esc(tt ? (tt.t.length > 60 ? tt.t.slice(0, 60) + "…" : tt.t) : "")}</small></td><td class="num ok-t">${s.ok}</td><td class="num ko-t">${s.ko}</td><td class="num">${s.bl}</td><td class="num">${pct(s.ok, tot)}%</td></tr>`; }).join("")}</tbody></table></div>
    </section>

    <div class="res-acc">
      ${t.f + t.b ? `<button class="btn" data-act="repetir-fallos" data-i="${idx}">Repetir solo fallos y blancos (${t.f + t.b})</button>` : ""}
      <a class="btn sec" href="#test">Nuevo test</a>
    </div>

    <section class="card">
      <div class="rev-cab"><h2>Corrección</h2>
        <div class="segmentado peq">
          ${[["todas", `Todas (${items.length})`], ["ko", `Fallos (${t.f})`], ["bl", `En blanco (${t.b})`], ["ok", `Aciertos (${t.a})`]].map(([v, l]) => `<button class="${filtroRevision === v ? "sel" : ""}" data-act="filtro" data-v="${v}">${l}</button>`).join("")}
        </div>
      </div>
      ${filtrados.length ? filtrados.map(({ q, r, ord }) => {
        const n = items.findIndex((x) => x.q === q) + 1;
        const est = r === -1 ? "bl" : r === q.a ? "ok" : "ko";
        return `<article class="rev ${est}">
          <p class="q-meta">Pregunta ${n} · Tema ${temaDe(q)} · <span class="estado">${est === "ok" ? "Acertada" : est === "ko" ? "Fallada" : "En blanco"}</span></p>
          <h3>${esc(q.q)}</h3>
          <ul class="rev-opts">${ord.map((k, pos) => `<li class="${k === q.a ? "correcta" : k === r ? "incorrecta" : ""}"><span class="letra">${LETRAS[pos]}</span><span>${esc(q.o[k])}</span>${k === q.a ? `<em>Correcta</em>` : k === r ? `<em>Tu respuesta</em>` : ""}</li>`).join("")}</ul>
          <p class="explic-txt">💡 ${esc(q.e)}</p>
        </article>`; }).join("") : `<p class="vacio">No hay preguntas en este filtro.</p>`}
    </section>`;
  }

  // ---------- Estadísticas ----------
  function vEstadisticas() {
    const g = statsGlobal();
    const filas = TEMAS.map((t) => ({ t, s: statsTema(t.n) })).filter((x) => x.s.total);
    const flojos = filas.filter((x) => x.s.resp >= 3).sort((a, b) => a.s.acierto - b.s.acierto).slice(0, 3);
    const hist = D.tests.slice().reverse();
    const evol = D.tests.slice(-15);
    return `
    <div class="cab"><h1>Estadísticas</h1><p>Todo tu progreso en un vistazo: aciertos, fallos, preguntas en blanco y nota por tema.</p></div>
    <section class="kpis">
      ${kpi("Respuestas totales", g.total, `${g.vistas} de ${PREGUNTAS.length} preguntas vistas`)}
      ${kpi("Aciertos", g.total ? pct(g.ok, g.total) + "%" : "—", `${g.ok} respuestas`, "ok")}
      ${kpi("Fallos", g.total ? pct(g.ko, g.total) + "%" : "—", `${g.ko} respuestas`, "ko")}
      ${kpi("En blanco", g.total ? pct(g.bl, g.total) + "%" : "—", `${g.bl} respuestas`)}
    </section>
    ${evol.length >= 2 ? `<section class="card"><h2>Evolución de la nota (últimos ${evol.length} tests)</h2>${graficoEvol(evol)}</section>` : ""}
    ${flojos.length ? `<section class="card aviso-flojos"><h2>Temas a reforzar</h2><ul>${flojos.map(({ t, s }) => `<li><a href="#tema-${t.n}">Tema ${t.n}</a> — ${s.acierto}% de aciertos <button class="btn sec peq" data-act="test-tema" data-n="${t.n}">Practicar</button></li>`).join("")}</ul></section>` : ""}
    <section class="card">
      <h2>Por tema</h2>
      <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Tema</th><th class="num">Vistas</th><th class="num">Respuestas</th><th>Aciertos</th><th class="num">Fallos</th><th class="num">Blanco</th></tr></thead>
      <tbody>${filas.map(({ t, s }) => `<tr>
        <td><a href="#tema-${t.n}">Tema ${t.n}</a></td>
        <td class="num">${s.vistas}/${s.total}</td><td class="num">${s.resp}</td>
        <td><div class="barrita" title="${s.acierto}%"><span style="width:${s.acierto}%" class="${s.acierto >= 70 ? "verde" : s.acierto >= 50 ? "ambar" : "rojo"}"></span></div> ${s.resp ? s.acierto + "%" : "—"}</td>
        <td class="num">${s.resp ? pct(s.ko, s.resp) + "%" : "—"}</td><td class="num">${s.resp ? pct(s.bl, s.resp) + "%" : "—"}</td></tr>`).join("")}</tbody></table></div>
    </section>
    <section class="card">
      <h2>Historial de tests</h2>
      ${hist.length ? tablaTests(hist) : `<p class="vacio">Aún no hay tests realizados.</p>`}
    </section>
    <section class="card peligro">
      <h2>Borrar progreso</h2>
      <p>Elimina todas tus respuestas, tests y temas marcados. No se puede deshacer.</p>
      <button class="btn rojo" data-act="reset">Borrar todo mi progreso</button>
    </section>`;
  }

  function graficoEvol(lista) {
    const W = 640, H = 180, P = 28;
    const x = (i) => P + (i * (W - 2 * P)) / Math.max(1, lista.length - 1);
    const y = (v) => H - P - (v / EX.escala) * (H - 2 * P);
    const pts = lista.map((t, i) => `${x(i).toFixed(1)},${y(t.nota).toFixed(1)}`).join(" ");
    return `<svg class="evol" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de la nota sobre 50">
      ${[0, 25, 50].map((v) => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" class="${v === 25 ? "corte" : "rejilla"}"/><text x="4" y="${y(v) + 4}" class="eje">${v}</text>`).join("")}
      <text x="${W - P}" y="${y(25) - 6}" class="eje" text-anchor="end">corte 25</text>
      <polyline points="${pts}" class="linea"/>
      ${lista.map((t, i) => `<circle cx="${x(i)}" cy="${y(t.nota)}" r="4" class="${t.nota >= EX.corte ? "p-ok" : "p-ko"}"><title>${esc(t.titulo)}: ${fmt1(t.nota)}</title></circle>`).join("")}
    </svg>`;
  }

  // ---------- Repaso de fallos ----------
  function vFallos() {
    const ids = pendientesRepaso();
    return `
    <div class="cab"><h1>Repaso de fallos</h1><p>Aquí se acumulan las preguntas que has fallado o dejado en blanco. Desaparecen cuando las aciertas.</p></div>
    ${ids.length ? `
      <div class="res-acc"><button class="btn grande" data-act="test-fallos">Hacer test de repaso (${ids.length})</button></div>
      <section class="card">
        ${ids.map((id) => { const q = Q_BY_ID[id]; const s = statsPregunta(id); return `
          <article class="rev ko">
            <p class="q-meta">Tema ${temaDe(q)} · fallada ${s.ko} ${s.ko === 1 ? "vez" : "veces"}${s.bl ? ` · ${s.bl} en blanco` : ""}</p>
            <h3>${esc(q.q)}</h3>
            <details><summary>Ver respuesta</summary>
              <p class="sol"><strong>${esc(q.o[q.a])}</strong></p><p class="explic-txt">💡 ${esc(q.e)}</p>
            </details>
          </article>`; }).join("")}
      </section>` : `<div class="card vacio"><p>🎉 No tienes fallos pendientes. Haz un <a href="#test">test</a> para seguir practicando.</p></div>`}`;
  }

  // ---------- Repaso: tarjetas con repetición espaciada ----------
  // Niveles 1-5 (sistema Leitner). Cada acierto sube un nivel y aleja el próximo repaso.
  const DIAS_NIVEL = { 1: 1, 2: 3, 3: 7, 4: 14, 5: 30 };
  const DIA = 86400000;
  const T_BY_ID = Object.fromEntries(TARJETAS.map((c) => [c.id, c]));
  const tarjetasDe = (materias) => TARJETAS.filter((c) => materias.includes(c.m));
  const finDeHoy = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); };
  const tarjetasPendientes = () => TARJETAS.filter((c) => { const s = D.tarj[c.id]; return s && s.due <= finDeHoy(); });
  function statsTarjetas(lista = TARJETAS) {
    let nuevas = 0, aprendiendo = 0, dominadas = 0;
    lista.forEach((c) => { const s = D.tarj[c.id]; if (!s) nuevas++; else if (s.b >= 4) dominadas++; else aprendiendo++; });
    return { nuevas, aprendiendo, dominadas, total: lista.length };
  }

  let SES = null; // sesión de tarjetas en curso
  let MAZO = { tipo: "hoy", tema: 1, bloque: "B1" };
  const TAM_SESION = 20;

  function crearSesion(tipo, valor) {
    let lista, titulo;
    if (tipo === "tema") { const t = TEMAS.find((x) => x.n === valor); lista = tarjetasDe(t.m); titulo = `Tema ${valor}`; }
    else if (tipo === "bloque") { const b = BLOQUES.find((x) => x.id === valor); lista = tarjetasDe(temasDeBloque(b).flatMap((t) => t.m)); titulo = `Bloque ${valor.slice(1)}`; }
    else if (tipo === "dificiles") { lista = TARJETAS.filter((c) => D.tarj[c.id] && D.tarj[c.id].b <= 2); titulo = "Las que más me cuestan"; }
    else { lista = TARJETAS; titulo = "Repaso de hoy"; }
    const hoy = finDeHoy();
    const pend = shuffle(lista.filter((c) => D.tarj[c.id] && D.tarj[c.id].due <= hoy));
    const nuevas = lista.filter((c) => !D.tarj[c.id]);
    const resto = shuffle(lista.filter((c) => D.tarj[c.id] && D.tarj[c.id].due > hoy)).sort((a, b) => D.tarj[a.id].b - D.tarj[b.id].b);
    // Hoy: pendientes y nuevas. Por tema o bloque: todo el mazo, empezando por lo más flojo.
    let cola = tipo === "hoy" ? pend.concat(nuevas) : pend.concat(nuevas, resto);
    cola = cola.slice(0, tipo === "hoy" ? TAM_SESION : Math.max(TAM_SESION, cola.length));
    if (!cola.length) return false;
    SES = { titulo, cola: cola.map((c) => c.id), idx: 0, girada: false, res: { no: 0, duda: 0, si: 0 }, repetidas: {} };
    return true;
  }

  function calificar(nota) {
    const id = SES.cola[SES.idx];
    const s = D.tarj[id] || { b: 0, due: 0, vistas: 0 };
    s.vistas = (s.vistas || 0) + 1;
    if (nota === "no") { s.b = 1; s.due = Date.now(); }
    else if (nota === "duda") { s.b = Math.max(1, s.b); s.due = Date.now() + DIA; }
    else { s.b = Math.min(5, (s.b || 0) + 1); s.due = Date.now() + DIAS_NIVEL[s.b] * DIA; }
    D.tarj[id] = s;
    SES.res[nota]++;
    // Lo que no sabías vuelve al final de esta misma sesión (una vez).
    if (nota === "no" && !SES.repetidas[id]) { SES.repetidas[id] = true; SES.cola.push(id); }
    SES.idx++; SES.girada = false;
    guardar();
    $("#app").innerHTML = vTarjeta();
  }

  function vRepaso(pest) {
    const st = statsTarjetas();
    const pend = tarjetasPendientes().length;
    const tabs = [["tarjetas", "🧠 Tarjetas"], ["tablas", "📋 Tablas de plazos"], ["trucos", "💡 Trucos"]];
    let cuerpo = "";
    if (pest === "tablas") cuerpo = `
      <p class="intro">Todas las cifras agrupadas para verlas de un vistazo. Pulsa <strong>«Tapar datos»</strong> para autoevaluarte: intenta recordar cada cifra y toca la casilla para comprobarla.</p>
      <div class="lista-tablas">${TABLAS.map((tb) => `<a class="accion" href="#tabla-${tb.id}"><span class="ico">📋</span><span><strong>${esc(tb.titulo)}</strong><small>${esc(tb.norma)} · ${tb.filas.filter((f) => f.length > 1).length} datos</small></span></a>`).join("")}</div>`;
    else if (pest === "trucos") {
      const conTruco = TARJETAS.filter((c) => c.tr);
      cuerpo = `<p class="intro">Reglas para recordar lo que no tiene lógica. Si se te ocurre una propia, mejor: lo que inventas tú se recuerda más.</p>
      ${TEMAS.filter((t) => conTruco.some((c) => t.m.includes(c.m))).map((t) => `
        <section class="card trucos"><h2><a href="#tema-${t.n}">Tema ${t.n}</a> <small>${esc(t.t.length > 70 ? t.t.slice(0, 70) + "…" : t.t)}</small></h2>
        <ul>${conTruco.filter((c) => t.m.includes(c.m)).map((c) => `<li><strong>${esc(c.f)}</strong><span>${esc(c.r)}</span><em>💡 ${esc(c.tr)}</em></li>`).join("")}</ul></section>`).join("")}`;
    } else cuerpo = `
      <section class="card hoy">
        <div>
          <h2>Repaso de hoy</h2>
          <p>${pend ? `Tienes <strong>${pend}</strong> tarjetas que toca repasar hoy` : "No tienes repasos pendientes"}${st.nuevas ? ` y <strong>${st.nuevas}</strong> nuevas por aprender` : ""}. Cada sesión son ${TAM_SESION} tarjetas como máximo: unos 5-10 minutos.</p>
        </div>
        <button class="btn grande" data-act="tarj-hoy" ${pend || st.nuevas ? "" : "disabled"}>Empezar</button>
      </section>
      <section class="kpis">
        ${kpi("Dominadas", st.dominadas, "Las sabes con seguridad", "ok")}
        ${kpi("Aprendiendo", st.aprendiendo, "Vuelven cada pocos días")}
        ${kpi("Nuevas", st.nuevas, `De ${st.total} tarjetas`)}
        ${kpi("Para hoy", pend, pend ? "Repásalas hoy" : "Al día")}
      </section>
      <section class="card">
        <h2>Cómo funciona</h2>
        <ol class="como">
          <li>Lee la pregunta e <strong>intenta responder de memoria</strong>, aunque sea en voz baja.</li>
          <li>Gira la tarjeta y sé sincero: <strong>No lo sabía</strong>, <strong>Dudé</strong> o <strong>Lo sabía</strong>.</li>
          <li>Lo que no sabes vuelve en la misma sesión y al día siguiente. Lo que sabes vuelve cada vez más tarde: a los 3 días, a la semana, a las 2 semanas y al mes.</li>
        </ol>
      </section>
      <section class="card">
        <h2>Repasar un tema o un bloque</h2>
        <div class="mazo-sel">
          <label class="campo">Tema<select id="mazo-tema">${TEMAS.filter((t) => tarjetasDe(t.m).length).map((t) => `<option value="${t.n}" ${t.n === MAZO.tema ? "selected" : ""}>Tema ${t.n}. ${esc(t.t.length > 60 ? t.t.slice(0, 60) + "…" : t.t)} (${tarjetasDe(t.m).length})</option>`).join("")}</select></label>
          <button class="btn sec" data-act="tarj-tema-sel">Repasar tema</button>
        </div>
        <div class="mazo-sel">
          <label class="campo">Bloque<select id="mazo-bloque">${BLOQUES.map((b) => `<option value="${b.id}" ${b.id === MAZO.bloque ? "selected" : ""}>Bloque ${b.id.slice(1)}. ${esc(b.nombre)}</option>`).join("")}</select></label>
          <button class="btn sec" data-act="tarj-bloque-sel">Repasar bloque</button>
        </div>
        ${TARJETAS.some((c) => D.tarj[c.id] && D.tarj[c.id].b <= 2) ? `<button class="btn sec" data-act="tarj-dificiles">Solo las que más me cuestan</button>` : ""}
      </section>`;
    return `
    <div class="cab"><h1>Repaso</h1><p>Para fijar en la memoria leyes, plazos y cifras sin tener que releerlo todo.</p></div>
    <nav class="pestanas" aria-label="Tipo de repaso">${tabs.map(([v, l]) => `<a href="#repaso-${v}" class="${pest === v ? "sel" : ""}">${l}</a>`).join("")}</nav>
    ${cuerpo}`;
  }

  function vTarjeta() {
    if (SES.idx >= SES.cola.length) {
      const r = SES.res, tot = r.no + r.duda + r.si;
      return `
      <div class="cab"><h1>¡Sesión terminada!</h1><p>${esc(SES.titulo)}</p></div>
      <section class="kpis">
        ${kpi("Lo sabía", r.si, pct(r.si, tot) + "%", "ok")}
        ${kpi("Dudé", r.duda, "Vuelven mañana")}
        ${kpi("No lo sabía", r.no, "Vuelven mañana", "ko")}
      </section>
      <div class="res-acc"><a class="btn" href="#repaso">Volver a Repaso</a>${tarjetasPendientes().length ? `<button class="btn sec" data-act="tarj-hoy">Otra sesión (${tarjetasPendientes().length} pendientes)</button>` : ""}</div>`;
    }
    const c = T_BY_ID[SES.cola[SES.idx]];
    const s = D.tarj[c.id];
    const tn = TEMA_DE_MATERIA[c.m];
    return `
    <div class="test-top">
      <div><strong>${esc(SES.titulo)}</strong><small>Tarjeta ${SES.idx + 1} de ${SES.cola.length}${s ? ` · nivel ${s.b} de 5` : " · nueva"}</small></div>
      <a class="btn sec peq" href="#repaso">Salir</a>
    </div>
    <div class="barra"><span style="width:${pct(SES.idx, SES.cola.length)}%"></span></div>
    <button class="tarjeta ${SES.girada ? "girada" : ""}" data-act="tarj-girar" aria-label="${SES.girada ? "Respuesta mostrada" : "Mostrar respuesta"}">
      <span class="t-meta">Tema ${tn || "—"}</span>
      <span class="t-frente">${esc(c.f)}</span>
      ${SES.girada ? `<span class="t-reverso">${esc(c.r)}</span>${c.tr ? `<span class="t-truco">💡 ${esc(c.tr)}</span>` : ""}` : `<span class="t-pista">Piensa la respuesta y toca para comprobarla <kbd>espacio</kbd></span>`}
    </button>
    ${SES.girada ? `
    <div class="calif">
      <button class="c-no" data-act="tarj-nota" data-v="no"><strong>No lo sabía</strong><small>Vuelve hoy <kbd>1</kbd></small></button>
      <button class="c-duda" data-act="tarj-nota" data-v="duda"><strong>Dudé</strong><small>Vuelve mañana <kbd>2</kbd></small></button>
      <button class="c-si" data-act="tarj-nota" data-v="si"><strong>Lo sabía</strong><small>En ${DIAS_NIVEL[Math.min(5, ((s && s.b) || 0) + 1)]} ${DIAS_NIVEL[Math.min(5, ((s && s.b) || 0) + 1)] === 1 ? "día" : "días"} <kbd>3</kbd></small></button>
    </div>` : `<div class="calif-placeholder"><button class="btn grande" data-act="tarj-girar">Ver respuesta</button></div>`}`;
  }

  function vTablaSola(id) {
    const tb = TABLAS.find((x) => x.id === id);
    if (!tb) return `<p>Tabla no encontrada. <a href="#repaso-tablas">Ver todas las tablas</a></p>`;
    const temasRel = TEMAS.filter((t) => tb.m.some((m) => t.m.includes(m)));
    return `
    <nav class="migas"><a href="#repaso-tablas">Repaso › Tablas</a></nav>
    <div class="cab tema-cab">
      <div><p class="sup">${esc(tb.norma)}</p><h1>${esc(tb.titulo)}</h1></div>
      <div class="tema-acc"><button class="btn" data-act="tapar" aria-pressed="false">🙈 Tapar datos</button></div>
    </div>
    ${tb.consejo ? `<div class="clave"><h3>Para recordarlo</h3><p>${esc(tb.consejo)}</p></div>` : ""}
    <section class="card">
      <div class="tabla-wrap"><table class="tabla repaso" id="tabla-repaso">
        <thead><tr><th>Dato</th><th>Para qué</th><th>Dónde</th></tr></thead>
        <tbody>${tb.filas.map((f) => f.length === 1
          ? `<tr class="grupo"><td colspan="3">${esc(f[0])}</td></tr>`
          : `<tr><td class="dato"><button class="celda" data-act="destapar">${esc(f[0])}</button></td><td>${esc(f[1])}</td><td><small>${esc(f[2])}</small></td></tr>`).join("")}</tbody>
      </table></div>
      <p class="pista-tapar" hidden>Toca cada casilla para ver la respuesta. <button class="enlace" data-act="destapar-todo">Destapar todo</button></p>
    </section>
    ${temasRel.length ? `<p class="rel">Temas relacionados: ${temasRel.map((t) => `<a href="#tema-${t.n}">Tema ${t.n}</a>`).join(" · ")}</p>` : ""}`;
  }

  // ---------- Eventos ----------
  let resetArmado = false;
  document.addEventListener("click", (ev) => {
    const go = ev.target.closest("[data-go]");
    if (go) { ir(go.dataset.go); return; }
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    switch (act) {
      case "rapido": crearTestRapido(); break;
      case "cfg-modo": CFG.modo = el.dataset.v; render(); break;
      case "cfg-nivel": CFG.nivel = el.dataset.v; render(); break;
      case "cfg-num": CFG.num = parseInt(el.dataset.v, 10); render(); break;
      case "cfg-corr": CFG.correccion = el.dataset.v; render(); break;
      case "empezar": crearTest(); break;
      case "test-tema": CFG.modo = "tema"; CFG.tema = parseInt(el.dataset.n, 10); CFG.num = 0; crearTest(); break;
      case "test-bloque": CFG.modo = "bloque"; CFG.bloque = el.dataset.b; CFG.num = 0; crearTest(); break;
      case "test-fallos": CFG.modo = "fallos"; CFG.num = 0; CFG.correccion = "inmediata"; crearTest(); break;
      case "responder": {
        const i = TEST.idx, oi = parseInt(el.dataset.oi, 10);
        TEST.resp[i] = TEST.resp[i] === oi && TEST.correccion !== "inmediata" ? null : oi;
        if (TEST.correccion === "inmediata" && TEST.resp[i] !== null) TEST.bloqueadas[i] = true;
        repintarTest(); break;
      }
      case "borrar": TEST.resp[TEST.idx] = null; repintarTest(); break;
      case "marcar": TEST.marcadas[TEST.idx] = !TEST.marcadas[TEST.idx]; repintarTest(); break;
      case "anterior": if (TEST.idx > 0) { TEST.idx--; repintarTest(true); } break;
      case "siguiente": if (TEST.idx < TEST.ids.length - 1) { TEST.idx++; repintarTest(true); } break;
      case "saltar": TEST.idx = parseInt(el.dataset.k, 10); repintarTest(true); break;
      case "terminar": {
        const sin = TEST.resp.filter((r) => r === null).length;
        if (sin && el.dataset.conf !== "1") { el.dataset.conf = "1"; el.textContent = `Hay ${sin} sin responder · pulsa otra vez para corregir`; el.classList.add("rojo"); return; }
        pararReloj(); finalizarTest(); break;
      }
      case "filtro": filtroRevision = el.dataset.v; render(); break;
      case "repetir-fallos": {
        const t = D.tests[parseInt(el.dataset.i, 10)];
        const ids = t.det.filter(([id, r]) => Q_BY_ID[id] && r !== Q_BY_ID[id].a).map(([id]) => id);
        TEST = { modo: "repaso", titulo: "Repaso: " + t.titulo, correccion: "inmediata", ids: shuffle(ids), orden: ids.map(() => shuffle([0, 1, 2, 3])), resp: ids.map(() => null), bloqueadas: ids.map(() => false), marcadas: ids.map(() => false), idx: 0, inicio: Date.now(), limite: null };
        ir("#hacer"); break;
      }
      case "estudiado": { const n = el.dataset.n; D.estudiados[n] = !D.estudiados[n]; guardar(); render(); break; }
      case "reset":
        if (!resetArmado) { resetArmado = true; el.textContent = "¿Seguro? Pulsa otra vez para borrarlo todo"; setTimeout(() => { resetArmado = false; if (el.isConnected) el.textContent = "Borrar todo mi progreso"; }, 5000); return; }
        resetArmado = false; const vistos = D.avisosVistos; D = vacio(); D.avisosVistos = vistos; guardar(); render(); break;
      case "tarj-hoy": ir(crearSesion("hoy") ? "#tarjetas" : "#repaso"); break;
      case "tarj-tema": if (crearSesion("tema", parseInt(el.dataset.n, 10))) ir("#tarjetas"); break;
      case "tarj-tema-sel": if (crearSesion("tema", MAZO.tema)) ir("#tarjetas"); break;
      case "tarj-bloque-sel": if (crearSesion("bloque", MAZO.bloque)) ir("#tarjetas"); break;
      case "tarj-dificiles": if (crearSesion("dificiles")) ir("#tarjetas"); break;
      case "tarj-girar": if (SES && !SES.girada) { SES.girada = true; $("#app").innerHTML = vTarjeta(); } break;
      case "tarj-nota": calificar(el.dataset.v); break;
      case "tapar": {
        const tabla = $("#tabla-repaso"); const on = !tabla.classList.contains("tapada");
        tabla.classList.toggle("tapada", on); tabla.querySelectorAll(".celda").forEach((c) => c.classList.remove("vista"));
        el.setAttribute("aria-pressed", on); el.textContent = on ? "👀 Mostrar datos" : "🙈 Tapar datos";
        $(".pista-tapar").hidden = !on; break;
      }
      case "destapar": el.classList.toggle("vista"); break;
      case "destapar-todo": document.querySelectorAll("#tabla-repaso .celda").forEach((c) => c.classList.add("vista")); break;
      case "cerrar-novedad": D.avisosVistos[VERSION_TEMARIO.id] = true; guardar(); pintarAviso(); break;
      case "descartar-test": TEST = null; render(); break;
      case "info-version": { const i = $("#info-version"); i.hidden = !i.hidden; break; }
    }
  });

  document.addEventListener("change", (ev) => {
    if (ev.target.id === "cfg-tema") { CFG.tema = parseInt(ev.target.value, 10); render(); }
    if (ev.target.id === "cfg-bloque") { CFG.bloque = ev.target.value; render(); }
    if (ev.target.id === "cfg-tiempo") CFG.tiempo = ev.target.checked;
    if (ev.target.id === "mazo-tema") MAZO.tema = parseInt(ev.target.value, 10);
    if (ev.target.id === "mazo-bloque") MAZO.bloque = ev.target.value;
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id !== "buscar") return;
    const term = ev.target.value.trim().toLowerCase();
    document.querySelectorAll(".tema-fila").forEach((li) => { li.hidden = term && !li.dataset.txt.includes(term) && !temaCoincide(li, term); });
    document.querySelectorAll(".bloque").forEach((b) => { b.hidden = ![...b.querySelectorAll(".tema-fila")].some((li) => !li.hidden); });
    const sr = $("#sin-resultados"); if (sr) sr.hidden = !!document.querySelector(".bloque:not([hidden])");
  });
  function temaCoincide(li, term) {
    const n = parseInt(li.querySelector("a").getAttribute("href").split("-")[1], 10);
    const t = TEMAS.find((x) => x.n === n);
    return t.m.some((m) => RESUMENES[m] && RESUMENES[m].norma.toLowerCase().includes(term));
  }

  // Teclado durante el test: 1-4 / A-D para responder, flechas para moverse.
  document.addEventListener("keydown", (ev) => {
    if (SES && location.hash === "#tarjetas" && SES.idx < SES.cola.length && !ev.target.matches("input, select, textarea")) {
      if ((ev.key === " " || ev.key === "Enter") && !SES.girada) { ev.preventDefault(); SES.girada = true; $("#app").innerHTML = vTarjeta(); return; }
      const notas = { "1": "no", "2": "duda", "3": "si" };
      if (SES.girada && notas[ev.key]) { ev.preventDefault(); calificar(notas[ev.key]); }
      return;
    }
    if (!TEST || !location.hash.startsWith("#hacer") || ev.target.matches("input, select, textarea")) return;
    const k = ev.key.toLowerCase();
    const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
    if (k in map && !TEST.bloqueadas[TEST.idx]) { const oi = TEST.orden[TEST.idx][map[k]]; TEST.resp[TEST.idx] = oi; if (TEST.correccion === "inmediata") TEST.bloqueadas[TEST.idx] = true; repintarTest(); }
    else if (ev.key === "ArrowRight" && TEST.idx < TEST.ids.length - 1) { TEST.idx++; repintarTest(true); }
    else if (ev.key === "ArrowLeft" && TEST.idx > 0) { TEST.idx--; repintarTest(true); }
  });

  function repintarTest(arriba) {
    $("#app").innerHTML = vHacer();
    if (arriba) window.scrollTo({ top: 0 });
  }

  function crearTestRapido() {
    const previa = CFG;
    CFG = Object.assign({}, CFG, { modo: "aleatorio", num: 10, correccion: "inmediata", tiempo: false });
    crearTest();
    CFG = previa;
    TEST.titulo = "Test rápido"; TEST.modo = "rapido";
  }

  // Avisar antes de salir con un test a medias.
  window.addEventListener("beforeunload", (ev) => { if (TEST && TEST.resp.some((r) => r !== null)) { ev.preventDefault(); ev.returnValue = ""; } });

  // ---------- Arranque ----------
  cargarLocal();
  render();
  fijarAlturaCabecera();
  if (typeof iniciarApp === "function") iniciarApp({ get datos() { return D; }, set datos(v) { D = Object.assign(vacio(), v); guardar(); render(); }, render, pintarEstadoGuardado });
  Nube.iniciar();

  // Exponer para pruebas automáticas (sin efecto en el uso normal).
  window.__app = { puntuar, get datos() { return D; }, get test() { return TEST; } };
})();

</script>
</body>
</html>
